# Kubelet drop-in that lets Burstable pods swap, so host zswap (compressor on IAA via
# iaa_crypto, or on QAT via qat_deflate / qat_zstd) can reach them. k3s reads drop-ins
# from /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/ and already sets failSwapOn:
# false. NodeSwap is GA in Kubernetes 1.34; the default swapBehavior is NoSwap.
# UNTESTED on k3d (the node is a container; swap is the host's). k3d-gpu up does not
# mount it yet; with k3d directly, add at cluster create:
#   --volume "$PWD/examples/dataplane/kubelet-limitedswap.conf:/var/lib/rancher/k3s/agent/etc/kubelet.conf.d/50-limitedswap.conf@server:*"
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
memorySwap:
  swapBehavior: LimitedSwap
