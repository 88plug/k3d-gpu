# BalloonsPolicy from k3d-gpu share/nri-balloons.yml (the dev twin's policy)
apiVersion: config.nri/v1alpha1
kind: BalloonsPolicy
metadata:
  name: default
  namespace: kube-system
spec:
  agent:
    nodeResourceTopology: true
    podResourceAPI: false
  allocatorTopologyBalancing: true
  balloonTypes:
  - matchExpressions:
    - key: pod/labels/k3d-gpu.io/cores
      operator: Equals
      values:
      - performance
    name: performance
    preferCoreType: performance
  - matchExpressions:
    - key: pod/labels/k3d-gpu.io/cores
      operator: Equals
      values:
      - efficient
    name: efficient
    preferCoreType: efficient
  - matchExpressions:
    - key: name
      operator: AlwaysTrue
    maxBalloons: 1
    name: shared
    shareIdleCPUsInSame: system
  control:
    rdt:
      enable: false
      options:
        l2:
          optional: true
        l3:
          optional: true
        mb:
          optional: true
      partitions:
        fullCache:
          classes:
            BestEffort:
              l2Allocation:
                all:
                  unified: 33%
              l3Allocation:
                all:
                  unified: 33%
            Burstable:
              l2Allocation:
                all:
                  unified: 66%
              l3Allocation:
                all:
                  unified: 66%
            Guaranteed:
              l2Allocation:
                all:
                  unified: 100%
              l3Allocation:
                all:
                  unified: 100%
          l2Allocation:
            all:
              unified: 100%
          l3Allocation:
            all:
              unified: 100%
      usePodQoSAsDefaultClass: true
  instrumentation:
    httpEndpoint: :8891
    prometheusExport: false
    reportPeriod: 60s
    samplingRatePerMillion: 0
  log:
    debug:
    - none
    klog:
      skip_headers: true
    source: true
  reservedPoolNamespaces:
  - kube-system
  reservedResources:
    cpu: 1000m
