# EI 3e8a244 roles/llm_services/tasks/deploy_models.yaml, the two tasks that carry the
# LiteLLM master key, for tests/eas_test.sh section argv:
#   L81-L90   the Secret read (kubernetes.core.k8s_info replaced by library/k8s_secret_stub.py,
#             which returns a Secret holding ARGV_FAKE_KEY)
#   L213-L241 the model deploy with its MM_LITELLM_MASTER_KEY line verbatim (L240); the
#             `./model-manager deploy` command replaced by a sleep that records whether
#             the task hands over a value
# https://github.com/intel/enterprise-inference/blob/3e8a24486b6ee812adf2bf452f8ba5751c16c8bd/roles/llm_services/tasks/deploy_models.yaml#L81-L90
# https://github.com/intel/enterprise-inference/blob/3e8a24486b6ee812adf2bf452f8ba5751c16c8bd/roles/llm_services/tasks/deploy_models.yaml#L213-L241
- hosts: localhost
  connection: local
  gather_facts: false
  vars:
    auth_type: litellm_vkey
  tasks:
    - name: "Deploy models | Load LiteLLM master key (when auth_type=litellm_vkey)"
      k8s_secret_stub:
        api_version: v1
        kind: Secret
        name: litellm-master-key
        namespace: "{{ litellm_namespace | default('litellm') }}"
      register: _deploy_litellm_secret
      failed_when: false
      no_log: true
      when: auth_type | default('jwt') == 'litellm_vkey'

    - name: Deploy each catalog model
      shell: |
        if [ -n "$MM_LITELLM_MASTER_KEY" ]; then echo set; else echo empty; fi > "{{ argv_out }}/key"; sleep 4
      environment:
        MM_LITELLM_MASTER_KEY: "{{ (_deploy_litellm_secret.resources[0].data.master_key | b64decode) if (auth_type | default('jwt') == 'litellm_vkey' and _deploy_litellm_secret.resources | default([]) | length > 0) else '' }}"
