# Prototype manifests for the k3d-gpu.io/mem-bw-gbps admission webhook.
# NOT applied by `k3d-gpu up`. Before use:
#   1. kubectl -n kube-system create configmap membw-code --from-file=membw.py
#   2. create Secret membw-tls (tls.crt/tls.key for membw.kube-system.svc)
#      and put its CA, base64-encoded, into caBundle below.
#   3. advertise node capacity (see README, "Node capacity").
# Only pods labelled k3d-gpu.io/mem-bw=auto are sent to the webhook.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: membw
  namespace: kube-system
  labels: {app: membw}
spec:
  replicas: 1
  selector:
    matchLabels: {app: membw}
  template:
    metadata:
      labels: {app: membw}
    spec:
      containers:
        - name: webhook
          image: python:3.12.15-slim
          command: ["python3", "/app/membw.py"]
          ports: [{containerPort: 8443}]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: code, mountPath: /app}
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - name: code
          configMap: {name: membw-code}
        - name: tls
          secret: {secretName: membw-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: membw
  namespace: kube-system
spec:
  selector: {app: membw}
  ports:
    - {port: 443, targetPort: 8443}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: membw.k3d-gpu.io
webhooks:
  - name: membw.k3d-gpu.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    timeoutSeconds: 5
    reinvocationPolicy: Never
    objectSelector:
      matchLabels: {k3d-gpu.io/mem-bw: auto}
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    clientConfig:
      service: {name: membw, namespace: kube-system, path: /mutate}
      caBundle: ""   # placeholder: base64 CA of membw-tls
---
# Example inference pod. The webhook adds requests/limits
# k3d-gpu.io/mem-bw-gbps = ceil(min(device reach, compute-tok-s x bytes/token)).
apiVersion: v1
kind: Pod
metadata:
  name: igpu-llama-8b
  labels: {k3d-gpu.io/mem-bw: auto}
  annotations:
    k3d-gpu.io/model-params-b: "8.03"
    k3d-gpu.io/weight-bits: "4.5"
    k3d-gpu.io/layers: "32"
    k3d-gpu.io/kv-heads: "8"
    k3d-gpu.io/head-dim: "128"
    k3d-gpu.io/ctx-tokens: "4096"
    k3d-gpu.io/device: igpu
    k3d-gpu.io/compute-tok-s: "6"
spec:
  containers:
    - name: ovms
      image: openvino/model_server:2026.4.1-gpu
      resources:
        limits: {gpu.intel.com/i915: "1"}
