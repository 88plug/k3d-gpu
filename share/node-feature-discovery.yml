apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: intel-dp-devices
spec:
  rules:
  - labels:
      intel.feature.node.kubernetes.io/gpu: "true"
    matchAny:
    - matchFeatures:
      - feature: pci.device
        matchExpressions:
          class:
            op: In
            value:
            - "0300"
            - "0380"
          vendor:
            op: In
            value:
            - "8086"
      - feature: kernel.enabledmodule
        matchName:
          op: In
          value:
          - i915
          - xe
    - matchFeatures:
      - feature: pci.device
        matchExpressions:
          class:
            op: In
            value:
            - "1200"
          device:
            op: In
            value:
            - 674c
            - 674d
            - 674e
            - 674f
            - "6750"
            - "6751"
          vendor:
            op: In
            value:
            - "8086"
      - feature: kernel.enabledmodule
        matchExpressions:
          xe:
            op: Exists
    name: intel.gpu
  - extendedResources:
      sgx.intel.com/epc: '@cpu.security.sgx.epc'
    labels:
      intel.feature.node.kubernetes.io/sgx: "true"
    matchFeatures:
    - feature: cpu.cpuid
      matchExpressions:
        SGX:
          op: Exists
        SGXLC:
          op: Exists
    - feature: cpu.security
      matchExpressions:
        sgx.enabled:
          op: IsTrue
    - feature: kernel.config
      matchExpressions:
        X86_SGX:
          op: Exists
    name: intel.sgx
---
