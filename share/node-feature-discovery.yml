# Node Feature Discovery v0.20.1 + Intel device-plugin NodeFeatureRules v0.37.1
# Sources (pinned):
#   https://github.com/kubernetes-sigs/node-feature-discovery/tree/v0.20.1/deployment/overlays/default
#   https://github.com/intel/intel-device-plugins-for-kubernetes/tree/v0.37.1/deployments/nfd/overlays/node-feature-rules
#   image registry.k8s.io/nfd/node-feature-discovery:v0.20.1, pinned to its multi-arch index digest
# Rendered with `kubectl kustomize` over the kustomization below (the two upstream
# trees unpacked from their release tarballs next to it). Re-render to bump.
#
# nfd-worker reads the kernel config (/proc/config.gz, else /boot/config-<release>),
# the builtin-module list (/lib/modules/<release>/modules.builtin) and os-release
# from the host. In a k3d node those paths hold the node image's own files, and a
# failed builtin-module read drops the whole kernel.enabledmodule feature, which
# Intel's intel.gpu rule matches on. So the worker reads them from /k3d-gpu/host,
# where `k3d-gpu up` bind-mounts the host's /lib/modules, /boot/config-<release>
# and /etc/os-release read-only. Without those mounts the paths are empty dirs and
# NFD still labels everything it reads from /sys, /proc and CPUID.
#
# One owner per label. The launcher sets some labels at node registration
# (intel.feature.node.kubernetes.io/{npu,dsa,iaa,qat} once the host side is set up,
# and cpu-cpuid.* for the CPU flags the kernel lists in /proc/cpuinfo). NFD does
# not publish those: the intel.npu/dsa/iaa/qat rules are dropped, and nfd-worker's
# cpuid attributeBlacklist is NFD's default list plus the launcher's names
# (scripts/k3d-gpu nfd_cpuid_name, and every AMX* id in klauspost/cpuid v2.4.0).
# NodeFeatureRules still match on those cpuid features; only the labels are off.
#
# kustomization.yaml:
#   resources:
#   - node-feature-discovery-0.20.1/deployment/overlays/default
#   - intel-device-plugins-for-kubernetes-0.37.1/deployments/nfd/overlays/node-feature-rules
#   images:
#   - name: registry.k8s.io/nfd/node-feature-discovery
#     newTag: v0.20.1@sha256:6fc5c9af9176e1acb5ce57a4a1d0c0d3eb25cd34f5bdd0efefebf0efe45a8379
#   patches:
#   - target: {kind: DaemonSet, name: nfd-worker}
#     patch: |-
#       - {op: test, path: /spec/template/spec/volumes/0/name, value: host-boot}
#       - {op: replace, path: /spec/template/spec/volumes/0/hostPath, value: {path: /k3d-gpu/host/boot, type: DirectoryOrCreate}}
#       - {op: test, path: /spec/template/spec/volumes/2/name, value: host-os-release}
#       - {op: replace, path: /spec/template/spec/volumes/2/hostPath, value: {path: /k3d-gpu/host/etc, type: DirectoryOrCreate}}
#       - {op: test, path: /spec/template/spec/volumes/4/name, value: host-usr-lib}
#       - {op: replace, path: /spec/template/spec/volumes/4/hostPath, value: {path: /k3d-gpu/host/lib, type: DirectoryOrCreate}}
#       - {op: test, path: /spec/template/spec/volumes/5/name, value: host-lib}
#       - {op: replace, path: /spec/template/spec/volumes/5/hostPath, value: {path: /k3d-gpu/host/lib, type: DirectoryOrCreate}}
#       - {op: test, path: /spec/template/spec/containers/0/volumeMounts/1/name, value: host-os-release}
#       - {op: replace, path: /spec/template/spec/containers/0/volumeMounts/1/mountPath, value: /host-etc}
#   - target: {kind: NodeFeatureRule, name: intel-dp-devices}
#     patch: |-
#       - {op: test, path: /spec/rules/5/name, value: intel.npu}
#       - {op: remove, path: /spec/rules/5}
#       - {op: test, path: /spec/rules/3/name, value: intel.qat}
#       - {op: remove, path: /spec/rules/3}
#       - {op: test, path: /spec/rules/2/name, value: intel.iaa}
#       - {op: remove, path: /spec/rules/2}
#       - {op: test, path: /spec/rules/0/name, value: intel.dsa}
#       - {op: remove, path: /spec/rules/0}
#   configMapGenerator:
#   - name: nfd-worker-conf
#     namespace: node-feature-discovery
#     behavior: replace
#     literals:
#     - |-
#       nfd-worker.conf=sources:
#         cpu:
#           cpuid:
#             attributeBlacklist: [AVX10, BMI1, BMI2, CLMUL, CMOV, CX16, ERMS, F16C, HTT, LZCNT, MMX, MMXEXT, NX, POPCNT, RDRAND, RDSEED, RDTSCP, SGX, SGXLC, SSE, SSE2, SSE3, SSE4, SSE42, SSSE3, TDX_GUEST, AMXBF16, AMXCOMPLEX, AMXFP16, AMXFP8, AMXINT8, AMXTF32, AMXTILE, AMXTRANSPOSE, AVX512BF16, AVX512F, AVX512VNNI, AVXVNNI, CETIBT, CETSS, GFNI, SHA, VAES]
