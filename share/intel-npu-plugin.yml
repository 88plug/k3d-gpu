# Intel NPU device plugin DaemonSet (Core Ultra: Meteor/Arrow/Lunar/Panther/Wildcat Lake NPU)
# Source: https://github.com/intel/intel-device-plugins-for-kubernetes (deployments/npu_plugin/base)
# Advertises npu.intel.com/accel, one per /dev/accel/accelN owned by the intel_vpu
# driver. Scheduled only onto nodes labelled intel.feature.node.kubernetes.io/npu=true
# (upstream's NFD label), which the k3d-gpu launcher sets when it detects an NPU:
# the plugin mounts /dev/accel and /sys/class/accel, which do not exist on hosts
# without an accel driver.
# Auto-bumped by the build-and-push workflow (same release train as the GPU plugin).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: intel-npu-plugin
  namespace: kube-system
  labels:
    app: intel-npu-plugin
spec:
  selector:
    matchLabels:
      app: intel-npu-plugin
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: intel-npu-plugin
    spec:
      automountServiceAccountToken: false
      priorityClassName: "system-node-critical"
      containers:
        - name: intel-npu-plugin
          image: intel/intel-npu-plugin:0.37.1
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            seLinuxOptions:
              type: "container_device_plugin_t"
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              memory: "45Mi"
              cpu: 40m
            limits:
              memory: "115Mi"
              cpu: 100m
          volumeMounts:
            - name: devfs
              mountPath: /dev/accel
              readOnly: true
            - name: sysfsaccel
              mountPath: /sys/class/accel
              readOnly: true
            - name: kubeletsockets
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: devfs
          hostPath:
            path: /dev/accel
        - name: sysfsaccel
          hostPath:
            path: /sys/class/accel
        - name: kubeletsockets
          hostPath:
            path: /var/lib/kubelet/device-plugins
      nodeSelector:
        kubernetes.io/arch: amd64
        intel.feature.node.kubernetes.io/npu: "true"
