# Prometheus server for the opt-in k3d-gpu telemetry stack
# Source: https://github.com/prometheus/prometheus (image quay.io/prometheus/prometheus:v3.15.1).
# Scrapes every pod in k3d-gpu-telemetry that declares a container port named
# `metrics` or `http` (node-exporter, intel-gpu-exporter, dcgm-exporter, optional xpumd),
# plus kube-system pods annotated prometheus.io/scrape=true on prometheus.io/port (the
# NRI balloons policy, which serves :8891/metrics once its BalloonsPolicy sets
# instrumentation.prometheusExport: true). Data lives in an emptyDir for 2 days.
# Reach it with `kubectl -n k3d-gpu-telemetry port-forward svc/prometheus 9090`.
#
# Recording rules (k3d-gpu.rules.yml):
#   k3d_gpu:cpu_utilisation:ratio{type}       busy fraction of the P-cores / E-cores
#   k3d_gpu:cpu_frequency_hertz:avg{type}     mean scaling frequency per core type
#   k3d_gpu:rapl_power:watts{rapl_zone}       package / core / uncore (iGPU) / psys power;
#                                             the MMIO package zone is dropped, it
#                                             measures the same package as intel-rapl:0
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: k3d-gpu-telemetry
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  namespace: k3d-gpu-telemetry
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  namespace: k3d-gpu-telemetry
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-discovery
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: k3d-gpu-telemetry
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k3d-gpu-telemetry-discovery
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k3d-gpu-telemetry-discovery
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k3d-gpu-telemetry-discovery
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: k3d-gpu-telemetry
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: k3d-gpu-telemetry
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/k3d-gpu.rules.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: k3d-gpu-telemetry
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [k3d-gpu-telemetry]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics|http
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: (.+)
            target_label: exporter
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: (.+)
            target_label: exporter
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: kube-system-annotated
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [kube-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: "true"
            action: keep
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: (.+)
            target_label: exporter
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
  k3d-gpu.rules.yml: |
    groups:
      - name: k3d-gpu
        rules:
          - record: k3d_gpu:cpu_utilisation:ratio
            expr: |
              sum by (instance, type) (
                rate(node_cpu_seconds_total{mode!~"idle|iowait"}[1m])
                * on (instance, cpu) group_left (type) k3d_gpu_cpu_core_type
              )
              / on (instance, type)
              count by (instance, type) (k3d_gpu_cpu_core_type)
          - record: k3d_gpu:cpu_frequency_hertz:avg
            expr: |
              avg by (instance, type) (
                node_cpu_scaling_frequency_hertz
                * on (instance, cpu) group_left (type) k3d_gpu_cpu_core_type
              )
          - record: k3d_gpu:rapl_power:watts
            expr: rate(node_rapl_joules_total{path!~".*intel-rapl-mmio.*"}[1m])
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: k3d-gpu-telemetry
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: k3d-gpu-telemetry
  labels:
    app: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
          ports:
            - name: web
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir:
            sizeLimit: 4Gi
