# NVIDIA DCGM exporter: per-GPU utilisation, clocks, power, energy, memory, PCIe, XID
# Source: https://github.com/NVIDIA/dcgm-exporter (helm chart deployment/ @ tag 4.8.4,
# image nvcr.io/nvidia/k8s/dcgm-exporter:4.6.1-4.8.4-distroless, DCGM 4.6.1),
# rendered with `helm template dcgm-exporter deployment --namespace k3d-gpu-telemetry
# --skip-tests` and the values below. Re-render to bump.
# Runs under the nvidia RuntimeClass (the image sets NVIDIA_VISIBLE_DEVICES=all, so it
# sees every GPU without requesting nvidia.com/gpu) and skips nodes the k3d-gpu
# launcher labels nvidia.com/gpu.present=false. Serves :9400/metrics.
#
# values:
#   runtimeClassName: nvidia
#   serviceMonitor: {enabled: false}
#   affinity: nodeAffinity nvidia.com/gpu.present NotIn ["false"]
#   tolerations: [control-plane NoSchedule, nvidia.com/gpu NoSchedule]
