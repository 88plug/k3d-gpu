                                            - bit numbers, e.g. `0-5`, `2,3`, must contain one contiguous block of bits set
                                            - hex bitmask, e.g. `0xff0`, must contain one contiguous block of bits set
                                          type: string
                                      type: object
                                    description: CatConfig contains the L2 or L3 cache
