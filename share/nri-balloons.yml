# Source: nri-resource-policy-balloons/templates/config.yaml
apiVersion: config.nri/v1alpha1
kind: BalloonsPolicy
metadata:
  name: default
  namespace: kube-system
  labels:
    helm.sh/chart: nri-resource-policy-balloons-v0.14.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nri-resource-policy-balloons
    app.kubernetes.io/instance: nri-resource-policy-balloons
spec:
  agent:
    nodeResourceTopology: true
    podResourceAPI: true
  allocatorTopologyBalancing: true
  balloonTypes:
  - allocatorTopologyBalancing: true
    matchExpressions:
    - key: pod/labels/k3d-gpu.io/cores
      operator: Equals
      values:
      - replica
    name: replica
    pinMemory: true
    preferCloseToDevices:
    - podresourceapi:*/*
    preferNewBalloons: true
    shareIdleCPUsInSame: numa
  - matchExpressions:
    - key: pod/labels/k3d-gpu.io/cores
      operator: Equals
      values:
      - performance
    name: performance
    preferCoreType: performance
  - matchExpressions:
    - key: pod/labels/k3d-gpu.io/cores
      operator: Equals
      values:
      - efficient
    name: efficient
    preferCoreType: efficient
  - matchExpressions:
    - key: pod/labels/k3d-gpu.io/cores
      operator: Equals
      values:
      - lowpower
    name: lowpower
    preferCoreType: efficient
  - loads:
    - ecluster-l2
    matchExpressions:
    - key: pod/labels/k3d-gpu.io/cores
      operator: Equals
      values:
      - ecluster
    maxCPUs: 4
    minCPUs: 4
    name: ecluster
    preferCoreType: efficient
  - hideHyperthreads: true
    matchExpressions:
    - key: pod/labels/k3d-gpu.io/cores
      operator: Equals
      values:
      - pcore-physical
    name: pcore-physical
    preferCoreType: performance
    preferSpreadOnPhysicalCores: false
  - hideHyperthreads: true
    matchExpressions:
    - key: pod/labels/k3d-gpu.io/cores
      operator: Equals
      values:
      - latency
    maxCPUs: 2
    name: latency
    preferCoreType: performance
    preferSpreadOnPhysicalCores: false
  - matchExpressions:
    - key: name
      operator: AlwaysTrue
    maxBalloons: 1
    name: shared
    shareIdleCPUsInSame: system
  control:
    rdt:
      enable: false
      options:
        l2:
          optional: true
        l3:
          optional: true
        mb:
          optional: true
      partitions:
        fullCache:
          classes:
            BestEffort:
              l2Allocation:
                all:
                  unified: 33%
              l3Allocation:
                all:
                  unified: 33%
            Burstable:
              l2Allocation:
                all:
                  unified: 66%
              l3Allocation:
                all:
                  unified: 66%
            Guaranteed:
              l2Allocation:
                all:
                  unified: 100%
              l3Allocation:
                all:
                  unified: 100%
          l2Allocation:
            all:
              unified: 100%
          l3Allocation:
            all:
              unified: 100%
      usePodQoSAsDefaultClass: true
  instrumentation:
    httpEndpoint: :8891
    prometheusExport: false
    reportPeriod: 60s
    samplingRatePerMillion: 0
  loadClasses:
  - level: l2cache
    name: ecluster-l2
  log:
    debug:
    - none
    klog:
      skip_headers: true
    source: true
  reservedPoolNamespaces:
  - kube-system
  reservedResources:
    cpu: 1000m
