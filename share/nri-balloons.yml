                        evaluated against an object which implements the Evaluable interface.
                        Evaluating an expression consists of looking up the value for the key
                        in the object, then using the operator to check it against the values
                        of the expression. The result is a single boolean value. An object is
                        said to satisfy the evaluated expression if this value is true. An
                        expression can contain 0, 1 or more values depending on the operator.
                      properties:
                        key:
                          description: Key is the expression key.
                          type: string
                        operator:
                          description: Op is the expression operator.
                          enum:
                          - Equals
                          - NotEqual
                          - In
                          - NotIn
                          - Exists
                          - NotExist
                          - AlwaysTrue
                          - Matches
                          - MatchesNot
                          - MatchesAny
                          - MatchesNone
                          type: string
                        values:
                          description: Values contains the values the key value is
                            evaluated against.
                          items:
                            type: string
                          type: array
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                type: object
              reservedPoolNamespaces:
                description: |-
                  ReservedPoolNamespaces is a list of namespace globs that
                  will be allocated to reserved CPUs.
                items:
                  type: string
                type: array
              reservedResources:
                additionalProperties:
                  type: string
                description: Reserved (CPU) resources for kube-system namespace.
                type: object
              schedulingClasses:
                description: |-
                  SchedulingClasses specify scheduling classes available in
                  balloon types.
                items:
                  description: |-
                    SchedulingClass specifies the default Linux scheduling and IO
                    priority parameters for containers assigned into this class.
                  properties:
                    deadline:
                      description: Deadline is the Linux SCHED_DEADLINE deadline value
                        to use (in microseconds).
                      format: int64
                      type: integer
                    flags:
                      description: |-
                        Flags is a list of Linux scheduling flags to set.
                        SCHED_FLAG_<ORIG_NAME> translates to <orig-name> etc.
                      enum:
                      - reset-on-fork
                      - reclaim
                      - dl-overrun
                      - keep-policy
                      - keep-params
                      - util-clamp-min
                      - util-clamp-max
                      items:
                        type: string
                      type: array
                    ioClass:
                      description: |-
                        IOClass is the IO scheduling class to use.
                        IOPRIO_CLASS_<NAME> translates to <name>.
                        Refer to ioprio_set(2) and ionice(1) for details.
                      enum:
                      - none
                      - rt
                      - be
                      - idle
                      type: string
                    ioPriority:
                      description: |-
                        IOPriority is the IO priority within the selected IO class to use.
                        Valid range depends on the selected class.
                        Refer to ionice(1) for details.
                      type: integer
                    name:
                      description: Name of the scheduling class.
                      type: string
                    nice:
                      description: Nice is the Linux nice value to use.
                      type: integer
                    period:
                      description: Period is the Linux SCHED_DEADLINE period value
                        to use (in microseconds).
                      format: int64
                      type: integer
                    policy:
                      description: |-
                        Policy is the Linux scheduling policy to use.
                        SCHED_<NAME> translates to <name> etc.
                      enum:
                      - none
                      - other
                      - fifo
                      - rr
                      - batch
                      - iso
                      - idle
                      - deadline
                      type: string
                    priority:
                      description: |-
                        Priority is the Linux scheduling priority to use.
                        Valid range depends on the selected policy.
                        Refer to sched_setscheduler(2) for details.
                      type: integer
                    runtime:
                      description: Runtime is the Linux SCHED_DEADLINE runtime value
                        to use (in microseconds).
                      format: int64
                      type: integer
                  required:
                  - name
                  type: object
                type: array
              showContainersInNrt:
                description: |-
                  ShowContainersInNrt controls whether containers in balloons
                  are exposed as part of NodeResourceTopology. If true,
                  noderesourcetopologies.topology.node.k8s.io custom
                  resources provide visibility to CPU and memory affinity of
                  containers assigned into balloons on any node. The default
                  is false. Use balloon-type option with the same name to
                  override the policy-level default. Exposing affinities of
                  all containers on all nodes may generate a lot of traffic
                  and large CR object updates to Kubernetes API server. This
                  options has no effect unless agent:NodeResourceTopology
                  enables basic topology exposure.
