                      to expose Prometheus metrics among other things.
                    example: :8891
                    type: string
                  logExportPeriod:
                    description: |-
                      LogCollectPeriod is the time window between batched log exports. In
                      other words, it is a log batch size expressed in terms of time.
                    type: string
                  logExporter:
                    description: |-
                      LogExporter defines which exporter is used to export logs.
                      The supported exporters are:
                        - otlp-http, http: use OpenTelemetry HTTP log exporter
                        - otlp-grpc, grpc: use OpenTelemetry gRPC log exporter
                    enum:
                    - otlp-http
                    - otlp-grpc
                    example: otlp-http
                    type: string
                  metrics:
                    default:
                      enabled:
                      - policy
                      - buildinfo
                    description: Metrics defines which metrics to collect.
                    properties:
                      enabled:
                        description: Enabled enables collection for metrics matched
                          by glob patterns.
                        example:
                        - '*'
                        items:
                          type: string
                        type: array
                      polled:
                        description: Polled forces polled collection for metrics matched
                          by glob patterns.
                        example:
                        - computationally-expensive-metrics
                        items:
                          type: string
                        type: array
                    type: object
                  metricsExporter:
                    description: |-
                      MetricsExporter defines which exporter is used to export metrics.
                      The supported exporters are:
                        - prometheus: use OpenTelemetry prometheus exporter
                        - otlp-http: use OpenTelemetry HTTP metrics exporter
                        - otlp-grpc: use OpenTelemetry gRPC metrics exporter
                    enum:
                    - prometheus
                    - otlp-http
                    - otlp-grpc
                    example: prometheus
                    type: string
                  prometheusExport:
                    description: |-
                      PrometheusExport enables exporting /metrics for Prometheus. This is
                      equivalent to setting MetricsExporter to "prometheus".
                    type: boolean
                  reportPeriod:
                    default: 30s
                    description: ReportPeriod is the interval between collecting polled
                      metrics.
                    format: duration
                    type: string
                  samplingRatePerMillion:
                    description: SamplingRatePerMillion is the number of samples to
                      collect per million spans.
                    example: 100000
                    type: integer
                  tracingCollector:
                    description: |-
                      TracingCollector defines the external endpoint for tracing data collection.
                      Endpoints are specified as full URLs, or as plain URL schemes which then
                      imply scheme-specific defaults. The supported schemes and their default
                      URLs are:
                        - otlp-http: use OpenTelemetry HTTP[S] tracing exporter/collector
                        - otlp-grpc: use OpenTelemetry gRPC tracing exported/collector
                    enum:
                    - otlp-http
                    - otlp-grpc
                    example: otlp-http
                    type: string
                type: object
              loadClasses:
                description: LoadClasses specify available loads in balloon types.
                items:
                  description: |-
