# NVIDIA Kubernetes device plugin DaemonSet
# Source: https://github.com/NVIDIA/k8s-device-plugin
# Bundled here to avoid a network fetch during 'k3d-gpu up'.
# Auto-bumped by the build-and-push workflow when upstream releases a new version.
# Skips nodes labelled nvidia.com/gpu.present=false, which the k3d-gpu launcher
# sets when the host has no NVIDIA GPU (the image also serves Intel/Gaudi hosts,
# where this pod could never start). Unlabelled nodes still run it, so a plain
# `k3d cluster create --gpus all` keeps working.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      # Run the plugin under the nvidia container runtime so NVML can load and
      # GPUs are advertised. k3s auto-creates this RuntimeClass when it detects
      # the nvidia runtime; without it the plugin runs under runc and reports
      # zero GPUs. Redundant once the node default runtime is nvidia, but keeps
      # this manifest correct when applied to a cluster that isn't.
      runtimeClassName: nvidia
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      priorityClassName: "system-node-critical"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.present
                    operator: NotIn
                    values: ["false"]
      containers:
        - image: nvcr.io/nvidia/k8s-device-plugin:v0.20.1
          name: nvidia-device-plugin-ctr
          env:
            - name: FAIL_ON_INIT_ERROR
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
