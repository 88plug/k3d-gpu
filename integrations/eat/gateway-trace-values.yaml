# k3d-gpu values for the GenAI Gateway's Langfuse trace stack, merged by
# gateway-charts.py over a copy of EAT's genai-gateway-trace/charts/langfuse/values.yaml.
# deploy-genai-gateway.yml installs langfuse/langfuse --version 1.5.30 (pinned by
# EAT) with that file as its values. Nothing in EAT's checkout is edited.
#
# Every image is name:tag@sha256 at the tag the chart rendered on 2026-10-18 (Langfuse
# appVersion 3.173.0; EAT's bitnamilegacy repositories at the subcharts' default
# tags), so the pins change no behaviour. Digests: `scripts/images-lock digest`.

