version: 2
updates:
  # GitHub Actions only. Every other pin (images, PyPI, tools, Hugging Face
  # revisions) belongs to the in-repo bumper: pins/registry.toml, moved by the
  # Freshness workflow (.github/workflows/freshness.yml). One updater per pin.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, automerge]
    commit-message:
      prefix: "deps"
