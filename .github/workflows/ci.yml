name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes its older run; main runs always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: .
          severity: warning
          version: v0.11.0

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # rhysd/actionlint 1.7.12 (bundles shellcheck for run: blocks), pinned by digest.
      - name: actionlint
        env:
          IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        run: docker run --rm -v "$PWD:/repo" -w /repo "$IMAGE" -color

  detect-tests:
    name: Detection tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: tests/detect_test.sh
      - run: tests/image_test.sh
      - run: tests/host_setup_test.sh
      - run: tests/eat_test.sh
      - run: tests/platforms_doc_test.sh
      - run: tests/reserved_cpus_test.sh
      - run: tests/experimental_test.sh
      - run: tests/phase_steer_test.sh
      - run: tests/prefill_guard_test.sh
      - run: tests/ci_wiring_test.sh

  quickstart-tests:
    name: Quickstart, uninstall and installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: tests/quickstart_test.sh
      - run: tests/quickstart_adversarial_test.sh

  fuzz-props:
    name: Launcher input properties (fuzz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # A fresh seed each run; a failure prints its FUZZ_SEED replay line.
      - run: python3 tests/fuzz/props.py

  remote-tests:
    name: Remote OpenAI endpoints (resolver, Secret, sandbox egress, redaction)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: python3 tests/remote_test.py
      - run: tests/remote_test.sh

  telemetry-tests:
    name: Telemetry manifests
    runs-on: ubuntu-latest
    env:
      PROMETHEUS_VERSION: 3.15.0
      PROMETHEUS_SHA256: 2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0
      # ghcr.io/yannh/kubeconform:v0.8.0
      KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install promtool
        run: |
          tgz="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          curl -fsSLo "/tmp/${tgz}" "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${tgz}"
          echo "${PROMETHEUS_SHA256}  /tmp/${tgz}" | sha256sum -c -
          tar xzf "/tmp/${tgz}" -C /tmp
          echo "/tmp/prometheus-${PROMETHEUS_VERSION}.linux-amd64" >> "${GITHUB_PATH}"
      - run: tests/telemetry_test.sh
      - name: kubeconform
        run: |
          k8s=$(sed -n 's/^ARG K3S_TAG="v\([0-9.]*\)-k3s.*/\1/p' Dockerfile)
          docker run --rm -v "${PWD}/share/telemetry:/m:ro" "${KUBECONFORM_IMAGE}" \
            -kubernetes-version "${k8s}" -strict -summary /m /m/optional

  agent-manifests:
    name: Agent manifests (kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: tests/agent_kubeconform.sh

  intel-gpu-dra-manifests:
    name: Intel GPU DRA manifests (kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: tests/kubeconform.sh

  share-manifests:
    name: share/ manifests (kubeconform, CRD schemas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml
      - run: tests/share_kubeconform.sh

  console-tests:
    name: Console spine (facts/v1, plan, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install jsonschema for the schema cross-check (pinned)
        run: python3 -m venv /tmp/jsonschema && /tmp/jsonschema/bin/pip install --disable-pip-version-check jsonschema==4.26.0
      - env:
          CONSOLE_JSONSCHEMA_PYTHON: /tmp/jsonschema/bin/python
        run: tests/console_test.sh
      - env:
          CONSOLE_JSONSCHEMA_PYTHON: /tmp/jsonschema/bin/python
        run: tests/audit_test.sh
      - name: MCP equals the CLI --json; MCP writes need a confirmed plan hash
        run: tests/console_mcp_test.sh

  # images.lock must list every image share/, the Dockerfile, the launcher and the
  # EAT integration reference, at the digests they pin (offline; `scripts/images-lock update`
  # refreshes it from the registries). Every image reference in the repo is
  # pinned name:tag@sha256, except those images.unpinned lists with a reason.
  images-lock:
    name: images.lock complete, every image pinned by digest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: scripts/images-lock check
      - run: tests/image_pins_test.sh

  report-html:
    name: report.html (goldens, offline load in headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 155.0.8059.84
      # The headless load runs Chrome in a network namespace (unshare -rn);
      # Ubuntu's AppArmor blocks unprivileged user namespaces by default.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - env:
          K3D_GPU_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          K3D_GPU_REQUIRE_HEADLESS: "1"
        run: tests/report_html_test.sh

  oracle:
    name: Capacity oracle (schema, privacy, validator, fuzz, matrix, leaderboard, share)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # V4 reads the server image each release tag pins
      - run: python3 oracle/test_oracle.py
      - run: python3 oracle/test_fuzz.py
      - run: python3 oracle/test_adversarial.py
      - name: Validate every committed bundle (maintainer seed trusted, data/oracle not)
        run: |
          mapfile -t seed < <(find oracle/seed -name '*.json' | sort)
          python3 oracle/validate.py --trusted "${seed[@]}"
          mapfile -t data < <(find data/oracle -name '*.json' | sort)
          if [ "${#data[@]}" -gt 0 ]; then python3 oracle/validate.py --strict "${data[@]}"; fi
      - name: docs/oracle-matrix.md is the matrix of the seed bundles
        run: |
          python3 oracle/matrix.py --trusted oracle/seed --md "${RUNNER_TEMP}/oracle-matrix.md" oracle/seed
          diff -u docs/oracle-matrix.md "${RUNNER_TEMP}/oracle-matrix.md"
      - name: docs/leaderboard.{md,json} match the bundles they list (new data/oracle files are pending)
        run: python3 oracle/leaderboard.py --check

  claims-check:
    name: Docs claims guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: tests/claims_check_test.sh
      - run: tests/claims_check.sh
      - run: python3 tests/ledger_drift_check_test.py
      - run: python3 tests/ledger_drift_check.py

  bench-tests:
    name: Bench harness tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: tests/bench_test.sh
      - run: tests/autoquant_test.sh
      - run: tests/bench_vs_test.sh

  tune-tests:
    name: k3d-gpu tune tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # TUNE_E2E_FULL: two whole tunes against tests/fake_ovms.py, one where no
      # config changes the speed (must keep the default) and one with a real winner.
      - run: tests/tune_test.sh
        env:
          TUNE_E2E_FULL: "1"

  capacity-tests:
    name: k3d-gpu capacity tests (stub server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: python3 bench/apb/test_capacity.py
      - run: python3 bench/apb/test_apb.py
      - run: python3 bench/apb/test_stage.py
      - run: python3 bench/test_agent_trace.py
      - run: python3 bench/load/test_load.py
      - run: python3 bench/eatflow/test_agentbench.py
      - run: python3 bench/eatflow/test_pairs.py
      - run: python3 bench/eatflow/test_h4345.py
      - run: python3 bench/prefill-guard/test_analyze.py

  mcp-tests:
    name: MCP server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: tests/mcp_test.sh

  kuberay-example:
    name: KubeRay example (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - run: tests/kuberay_test.sh

  chat-ui-manifest:
    name: Chat UI manifest (static + kubeconform)
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install kubeconform
        run: |
          curl -fsSL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          sudo tar -xzf kubeconform.tar.gz -C /usr/local/bin kubeconform
      - run: tests/chat_ui_test.sh
      - run: tests/model_share_test.sh

  # One job per tests/fixtures/<platform>, so a new fixture joins the matrix
  # without editing this file.
  sim-fixtures:
    name: Simulated hardware list
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.list.outputs.platforms }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - id: list
        run: echo "platforms=$(tests/sim_matrix_test.sh --list-json)" >> "$GITHUB_OUTPUT"

  sim-matrix:
    name: Simulated hardware (${{ matrix.platform }})
    needs: sim-fixtures
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.sim-fixtures.outputs.platforms) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - env:
          PLATFORM: ${{ matrix.platform }}
        run: tests/sim_matrix_test.sh "$PLATFORM"

  agent-examples:
    name: Agent framework examples (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [openai-agents, langgraph, crewai, llamaindex, litellm-gateway]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: tests/agent_examples_test.sh "${{ matrix.example }}"

  register-model-test:
    name: LiteLLM register-model.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: tests/register_model_test.sh

  render:
    name: Rendered components
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install pinned helm
        run: |
          hack/install-helm "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Render tests
        run: tests/render_test.sh
      # Every baked manifest under share/ that a component renders must be exactly
      # what its pinned chart renders to: no hand edits, no stale pins.
      - name: Committed manifests match their pinned render
        run: |
          hack/render-component
          git diff --exit-code -- share/ || { echo "::error::share/ differs from hack/render-component output; re-render and commit"; exit 1; }

  packaging-tests:
    name: Packaging consistency tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: tests/packaging_test.sh

  deb-rpm:
    name: Build and test .deb + .rpm (nfpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: packaging/check.sh nfpm

  homebrew:
    name: Homebrew formula style, audit, install, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: packaging/check.sh brew

  nix-flake:
    name: Nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: packaging/check.sh nix

  hadolint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  pkgbuild-lint:
    name: Lint PKGBUILD in Arch container
    runs-on: ubuntu-latest
    container: archlinux:latest@sha256:3c64b538588416593f69a1aebd2f2ec0f2541b29159f32556fa7def2167147a0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install tools
        run: pacman -Sy --noconfirm namcap base-devel
      - name: Create builder user
        run: |
          useradd -m builder
          chown -R builder .
      - name: Validate .SRCINFO
        run: |
          cd packaging/aur
          su builder -c 'makepkg --printsrcinfo' > /tmp/srcinfo-actual
          diff -u .SRCINFO /tmp/srcinfo-actual || { echo "::error::.SRCINFO drift — regenerate"; exit 1; }
      - name: namcap
        run: namcap packaging/aur/PKGBUILD || true

  kserve-example:
    name: KServe example (stub install + kubeconform 1.34/1.35)
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: Install kubeconform and PyYAML
        run: |
          curl -fsSL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          sudo tar -xzf kubeconform.tar.gz -C /usr/local/bin kubeconform
          sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml
      - run: tests/kserve_test.sh
