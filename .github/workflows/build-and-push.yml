name: Auto-update, Build & Release

# Two jobs, picked by the `release` input:
#
#   check   (nightly, or manual without `release`): resolve upstream versions; when
#           one moved (or `force`), commit the bumped pins to main and dispatch
#           auto-release.yml, which cuts a launcher release for them.
#   release (dispatched by auto-release.yml with `release=X.Y.Z`): build the image
#           from tag aur-vX.Y.Z, publish <repo>:X.Y.Z (the launcher's default
#           image) next to the floating tags, then dispatch aur-deploy.yml and
#           packages.yml (deb, rpm, Homebrew) so the launcher reaches every package
#           channel only once its image exists.
#
# Every image is built from a release tag, so every published image has a
# launcher version. Pushes made with GITHUB_TOKEN start no workflow runs, but
# workflow_dispatch does, hence the explicit dispatches.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'check: cut a release even if tracked versions are unchanged (fresh base-image rebuild)'
        type: boolean
        default: false
      release:
        description: 'release: launcher version X.Y.Z to build the image for (tag aur-vX.Y.Z must exist)'
        type: string
        default: ''

concurrency:
  group: build-and-push
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  check:
    if: ${{ !inputs.release }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      # ─── 1. Latest k3s release (multi-arch tag + index digest) ───────────
      - name: Get latest k3s tag
        id: k3s
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # rancher/k3s stopped publishing per-arch "-amd64" tags after
          # v1.34.1-k3s1-amd64; every release since is a multi-arch tag
          # (v1.37.1-k3s1). Take the highest non-prerelease k3s release by version
          # (not GitHub's "latest" flag: all minors release within seconds of each
          # other), map "+k3s" to the "-k3s" image tag, and require Docker Hub to
          # serve it with an amd64 image before pinning its index digest.
          rel=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/k3s-io/k3s/releases?per_page=100" \
            | jq -r '.[] | select(.prerelease == false and .draft == false) | .tag_name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+$' | sort -V | tail -n1)
          [ -n "$rel" ] || { echo "::error::no k3s release resolved from GitHub"; exit 1; }
          latest=${rel/+/-}
          hub=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
            "https://registry.hub.docker.com/v2/repositories/rancher/k3s/tags/${latest}") \
            || { echo "::error::rancher/k3s:${latest} not on Docker Hub yet"; exit 1; }
          printf '%s' "$hub" | jq -e '.images[] | select(.architecture == "amd64")' >/dev/null \
            || { echo "::error::rancher/k3s:${latest} has no amd64 image"; exit 1; }
          digest=$(printf '%s' "$hub" | jq -r '.digest')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for rancher/k3s:${latest}"; exit 1; }
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # ─── 2. Latest NVIDIA device plugin release (baked into the image) ───
      - name: Get latest NVIDIA device plugin version
        id: nvidia_plugin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Authenticate to api.github.com — the runner's shared IP blows the 60/hr
          # anonymous limit; an authenticated token gets 5000/hr.
          latest=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/NVIDIA/k8s-device-plugin/releases/latest" \
            | jq -r '.tag_name')
          # Only vX.Y.Z: the tag is expanded inside later run scripts and written into
          # share/nvidia-device-plugin.yml.
          [[ "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::no device-plugin release resolved (got '$latest')"; exit 1; }
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      # ─── 2b. Latest Intel GPU device plugin (Arc / Xe2 Battlemage) ───────
      - name: Get latest Intel GPU device plugin version
        id: intel_plugin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Docker Hub image tags drop the leading "v" the GitHub release tag carries.
          latest=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/intel/intel-device-plugins-for-kubernetes/releases/latest" \
            | jq -r '.tag_name | ltrimstr("v")')
          [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::no Intel GPU plugin release resolved (got '$latest')"; exit 1; }
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      # ─── 2c. Latest Intel Gaudi (HPU) device plugin ──────────────────────
      - name: Get latest Gaudi device plugin version
        id: gaudi_plugin
        run: |
          # Tags look like 1.24.2-481 (software release - build). Published on Docker Hub.
          latest=$(
            url="https://registry.hub.docker.com/v2/repositories/intel/gaudi-device-plugin/tags?page_size=100"
            for _ in $(seq 1 5); do
              [ -z "$url" ] && break; [ "$url" = "null" ] && break
              resp=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 "$url") || break
              printf '%s\n' "$resp" | jq -r '.results[].name'
              url=$(printf '%s' "$resp" | jq -r '.next')
            done | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$' | sort -V | tail -n1
          )
          [ -n "$latest" ] || { echo "::error::no Gaudi device-plugin tag resolved"; exit 1; }
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      # ─── 3. Latest CUDA base — used ONLY for the `k3d-gpu test` pod image, ─
      #        not the node base (the node runs on Ubuntu now).
      - name: Get latest CUDA tag for the test pod image
        id: cuda
        run: |
          latest=$(
            url="https://registry.hub.docker.com/v2/repositories/nvidia/cuda/tags?page_size=100&name=base-ubuntu"
            for _ in $(seq 1 20); do
              [ -z "$url" ] && break; [ "$url" = "null" ] && break
              resp=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 "$url") || break
              printf '%s\n' "$resp" | jq -r '.results[].name'
              url=$(printf '%s' "$resp" | jq -r '.next')
            done | grep -E '^[0-9][0-9.]*-base-ubuntu[0-9.]+$' | sort -V | tail -n1
          )
          [ -n "$latest" ] || { echo "::error::no CUDA test-image tag resolved"; exit 1; }
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      # ─── 4. NVIDIA container toolkit apt packages (the Dockerfile's pins) ─
      - name: Get latest NVIDIA container toolkit version
        id: nvctk
        run: |
          idx=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
            https://nvidia.github.io/libnvidia-container/stable/deb/amd64/Packages)
          # newest X.Y.Z-N (no ~rc) of a package in the index
          newest() {
            printf '%s\n' "$idx" | awk -v p="$1" '/^Package: /{n=$2} /^Version: /{if (n == p) print $2}' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$' | sort -V | tail -n1
          }
          ctk=$(newest nvidia-container-toolkit)
          rt=$(newest nvidia-container-runtime)
          [ -n "$ctk" ] && [ -n "$rt" ] || { echo "::error::no NVIDIA container toolkit version resolved"; exit 1; }
          # The Dockerfile installs these four at one version.
          for p in nvidia-container-toolkit-base libnvidia-container-tools libnvidia-container1; do
            printf '%s\n' "$idx" | awk -v p="$p" -v v="$ctk" '/^Package: /{n=$2} /^Version: /{if (n == p && $2 == v) f=1} END{exit !f}' \
              || { echo "::error::$p $ctk not in NVIDIA's apt repo yet"; exit 1; }
          done
          { echo "ctk=$ctk"; echo "runtime=$rt"; } >> "$GITHUB_OUTPUT"

      # ─── 4b. kobuk-team PPA builds (host-setup's Ubuntu media/gmmlib pins) ─
      - name: Get current kobuk-team PPA builds
        id: ppa
        run: |
          # host-setup installs the PPA's media driver, libva and gmmlib by exact
          # version, and the PPA serves only its current build of each: a pin it has
          # superseded no longer installs. hack/ppa-pins prints the HS_PPA_* lines for
          # its current noble and resolute builds, and fails when one pin cannot
          # cover both releases. Its exit code ends the step (a step without a
          # shell: key runs bash -e, without pipefail): empty outputs would read
          # as moved pins.
          pins=$(hack/ppa-pins)
          printf '%s\n' "$pins" | tee -a "$GITHUB_OUTPUT"

      - name: Read current pinned versions
        id: current
        run: |
          kt=$(grep '^ARG K3S_TAG' Dockerfile | cut -d= -f2 | tr -d '"')
          pp=$(grep -oE 'k8s-device-plugin:v[0-9]+\.[0-9]+\.[0-9]+' share/nvidia-device-plugin.yml | cut -d: -f2)
          ti=$(grep -oE 'K3D_GPU_TEST_IMAGE:-nvidia/cuda:[^}@]*' scripts/k3d-gpu | sed 's#.*nvidia/cuda:##')
          {
            echo "k3s=$kt"
            echo "k3sdigest=$(grep '^ARG K3S_DIGEST' Dockerfile | cut -d= -f2 | tr -d '"')"
            echo "plugin=$pp"
            echo "intel=$(grep -oE 'intel-gpu-plugin:[0-9]+\.[0-9]+\.[0-9]+' share/intel-gpu-plugin.yml | cut -d: -f2)"
            echo "gaudi=$(grep -oE 'gaudi-device-plugin:[0-9]+\.[0-9]+\.[0-9]+-[0-9]+' share/gaudi-device-plugin.yml | cut -d: -f2)"
            echo "testcuda=$ti"
            echo "nvctk=$(grep '^ARG NVIDIA_CTK_VERSION' Dockerfile | cut -d= -f2 | tr -d '"')"
            echo "nvrt=$(grep '^ARG NVIDIA_CONTAINER_RUNTIME_VERSION' Dockerfile | cut -d= -f2 | tr -d '"')"
            grep '^HS_PPA_' scripts/k3d-gpu
          } >> "$GITHUB_OUTPUT"

      - name: Determine if a release is needed
        id: need
        run: |
          # changed: a tracked upstream version moved (bump files + README row).
          # update:  cut a release — on a change or a forced dispatch.
          changed=false
          if [ "${{ steps.k3s.outputs.latest }}" != "${{ steps.current.outputs.k3s }}" ] || \
             [ "${{ steps.k3s.outputs.digest }}" != "${{ steps.current.outputs.k3sdigest }}" ] || \
             [ "${{ steps.nvidia_plugin.outputs.latest }}" != "${{ steps.current.outputs.plugin }}" ] || \
             [ "${{ steps.intel_plugin.outputs.latest }}" != "${{ steps.current.outputs.intel }}" ] || \
             [ "${{ steps.gaudi_plugin.outputs.latest }}" != "${{ steps.current.outputs.gaudi }}" ] || \
             [ "${{ steps.cuda.outputs.latest }}" != "${{ steps.current.outputs.testcuda }}" ] || \
             [ "${{ steps.nvctk.outputs.ctk }}" != "${{ steps.current.outputs.nvctk }}" ] || \
             [ "${{ steps.nvctk.outputs.runtime }}" != "${{ steps.current.outputs.nvrt }}" ] || \
             [ "${{ steps.ppa.outputs.HS_PPA_MEDIA }}" != "${{ steps.current.outputs.HS_PPA_MEDIA }}" ] || \
             [ "${{ steps.ppa.outputs.HS_PPA_GMM }}" != "${{ steps.current.outputs.HS_PPA_GMM }}" ] || \
             [ "${{ steps.ppa.outputs.HS_PPA_LIBVA }}" != "${{ steps.current.outputs.HS_PPA_LIBVA }}" ]; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" = "true" ] || [ "${{ inputs.force }}" = "true" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump pinned versions
        if: steps.need.outputs.update == 'true'
        run: |
          sed -i "s|^ARG K3S_TAG=.*|ARG K3S_TAG=\"${{ steps.k3s.outputs.latest }}\"|" Dockerfile
          sed -i "s|^ARG K3S_DIGEST=.*|ARG K3S_DIGEST=\"${{ steps.k3s.outputs.digest }}\"|" Dockerfile
          sed -i "s|^ARG NVIDIA_CTK_VERSION=.*|ARG NVIDIA_CTK_VERSION=\"${{ steps.nvctk.outputs.ctk }}\"|" Dockerfile
          sed -i "s|^HS_NVCTK=.*|HS_NVCTK=${{ steps.nvctk.outputs.ctk }}|" scripts/k3d-gpu
          # The PPA pins in the launcher and the README host-setup table.
          hack/ppa-pins --write scripts/k3d-gpu README.md
          sed -i "s|^ARG NVIDIA_CONTAINER_RUNTIME_VERSION=.*|ARG NVIDIA_CONTAINER_RUNTIME_VERSION=\"${{ steps.nvctk.outputs.runtime }}\"|" Dockerfile
          sed -i "s|k8s-device-plugin:v[0-9]*\.[0-9]*\.[0-9]*|k8s-device-plugin:${{ steps.nvidia_plugin.outputs.latest }}|" share/nvidia-device-plugin.yml
          sed -i "s|intel-gpu-plugin:[0-9]*\.[0-9]*\.[0-9]*|intel-gpu-plugin:${{ steps.intel_plugin.outputs.latest }}|" share/intel-gpu-plugin.yml
          # The WSL variant runs the same plugin plus its Level Zero sidecar from that release.
          sed -i -E "s#intel-gpu-(plugin|levelzero):[0-9]+\.[0-9]+\.[0-9]+#intel-gpu-\1:${{ steps.intel_plugin.outputs.latest }}#" share/intel-gpu-wsl-plugin.yml
          # NPU/DSA/IAA/QAT plugins ship in the same intel-device-plugins release as the GPU plugin.
          for p in npu dsa iaa qat; do
            sed -i "s|intel-$p-plugin:[0-9]*\.[0-9]*\.[0-9]*|intel-$p-plugin:${{ steps.intel_plugin.outputs.latest }}|" "share/intel-$p-plugin.yml"
          done
          sed -i "s|gaudi-device-plugin:[0-9]*\.[0-9]*\.[0-9]*-[0-9]*|gaudi-device-plugin:${{ steps.gaudi_plugin.outputs.latest }}|" share/gaudi-device-plugin.yml
          sed -i "s|K3D_GPU_TEST_IMAGE:-nvidia/cuda:[^}]*|K3D_GPU_TEST_IMAGE:-nvidia/cuda:${{ steps.cuda.outputs.latest }}|" scripts/k3d-gpu
          # The seds moved tags only: write each bumped reference's digest from its
          # registry, then re-pin images.lock (and k3s's own image list) for them.
          scripts/images-lock repin share/nvidia-device-plugin.yml share/intel-*-plugin.yml \
            share/gaudi-device-plugin.yml scripts/k3d-gpu
          scripts/images-lock pins
          scripts/images-lock update
          scripts/images-lock check

      - name: Update README
        if: steps.need.outputs.changed == 'true'
        run: |
          today=$(date -u +'%Y-%m-%d')
          entry="| $today | ${{ steps.k3s.outputs.latest }} | ${{ steps.nvidia_plugin.outputs.latest }} | v${{ steps.intel_plugin.outputs.latest }} | ${{ steps.gaudi_plugin.outputs.latest }} |"
          awk -v e="$entry" \
              -v k3s="${{ steps.k3s.outputs.latest }}" \
              -v k3sdigest="${{ steps.k3s.outputs.digest }}" \
              -v plugin="${{ steps.nvidia_plugin.outputs.latest }}" '
            /^## Release History/ { in_rh = 1 }
            in_rh && /^\|----------/ { print; print e; in_rh = 0; next }
            /^\| `K3S_TAG`/ { sub(/`v[0-9][^`]*-k3s[0-9]+(-amd64)?`/, "`" k3s "`"); print; next }
            /^\| `K3S_DIGEST`/ { sub(/`sha256:[0-9a-f]+…`/, "`" substr(k3sdigest, 1, 15) "…`"); print; next }
            /k8s-device-plugin\/v[0-9]/ { sub(/v[0-9]+\.[0-9]+\.[0-9]+/, plugin); print; next }
            { print }
          ' README.md > README.md.new && mv README.md.new README.md

      - name: Commit & push version bump
        if: steps.need.outputs.update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Dockerfile README.md images.lock share/nvidia-device-plugin.yml share/intel-*-plugin.yml share/gaudi-device-plugin.yml scripts/k3d-gpu
          if git diff --cached --quiet; then
            echo "no version changes to commit (forced release)"
          else
            git commit -m "chore: bump k3s→${{ steps.k3s.outputs.latest }} & device-plugin→${{ steps.nvidia_plugin.outputs.latest }}"
            git push origin HEAD:main
          fi

      # auto-release.yml bumps the launcher VERSION, tags aur-vX.Y.Z and dispatches
      # this workflow back with release=X.Y.Z to build the image.
      - name: Dispatch launcher release
        if: steps.need.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run auto-release.yml --ref main

  release:
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ inputs.release }}
    steps:
      - name: Validate release version
        run: |
          [[ "$RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::release '$RELEASE' is not X.Y.Z"; exit 1; }

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: aur-v${{ inputs.release }}

      - name: Read pinned versions
        id: current
        run: |
          # The launcher in this tag defaults to <repo>:<VERSION>; build only for it.
          lv=$(sed -n 's/^VERSION="\(.*\)".*/\1/p' scripts/k3d-gpu)
          [ "$lv" = "$RELEASE" ] || { echo "::error::scripts/k3d-gpu VERSION '$lv' at aur-v$RELEASE is not '$RELEASE'"; exit 1; }
          {
            echo "k3s=$(grep '^ARG K3S_TAG' Dockerfile | cut -d= -f2 | tr -d '"')"
            echo "plugin=$(grep -oE 'k8s-device-plugin:v[0-9]+\.[0-9]+\.[0-9]+' share/nvidia-device-plugin.yml | cut -d: -f2)"
            echo "intel=$(grep -oE 'intel-gpu-plugin:[0-9]+\.[0-9]+\.[0-9]+' share/intel-gpu-plugin.yml | cut -d: -f2)"
            echo "gaudi=$(grep -oE 'gaudi-device-plugin:[0-9]+\.[0-9]+\.[0-9]+-[0-9]+' share/gaudi-device-plugin.yml | cut -d: -f2)"
          } >> "$GITHUB_OUTPUT"
          # The 24.04 variant's base, pinned in the Dockerfile where the nightly repin moves it.
          u=$(grep '^ARG UBUNTU_2404_IMAGE=' Dockerfile | cut -d= -f2 | tr -d '"')
          [[ "$u" =~ ^ubuntu:24\.04@sha256:[0-9a-f]{64}$ ]] || { echo "::error::Dockerfile at aur-v$RELEASE pins no ubuntu:24.04 UBUNTU_2404_IMAGE (got '$u')"; exit 1; }
          echo "ubuntu2404=$u" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DockerHub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A version tag is published once: a launcher release always names the same image.
      - name: Refuse to overwrite a published version tag
        env:
          IMAGE: cryptoandcoffee/k3d-gpu
        run: |
          if docker buildx imagetools inspect "$IMAGE:$RELEASE" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$RELEASE is already published; cut a new launcher release instead"
            exit 1
          fi

      # Ubuntu 26.04 is the default (:latest and :X.Y.Z); 24.04 is also published.
      # Each carries the baked device plugins, so clusters expose GPUs with no apply.
      - name: Build & push — Ubuntu 26.04 (default / latest)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.version=${{ inputs.release }}
            org.opencontainers.image.revision=aur-v${{ inputs.release }}
          tags: |
            cryptoandcoffee/k3d-gpu:${{ inputs.release }}
            cryptoandcoffee/k3d-gpu:${{ inputs.release }}-ubuntu26.04
            cryptoandcoffee/k3d-gpu:latest
            cryptoandcoffee/k3d-gpu:ubuntu26.04
            cryptoandcoffee/k3d-gpu:${{ steps.current.outputs.k3s }}-ubuntu26.04
            ghcr.io/${{ github.repository_owner }}/k3d-gpu:${{ inputs.release }}
            ghcr.io/${{ github.repository_owner }}/k3d-gpu:${{ inputs.release }}-ubuntu26.04
            ghcr.io/${{ github.repository_owner }}/k3d-gpu:latest
            ghcr.io/${{ github.repository_owner }}/k3d-gpu:ubuntu26.04
            ghcr.io/${{ github.repository_owner }}/k3d-gpu:${{ steps.current.outputs.k3s }}-ubuntu26.04

      - name: Build & push — Ubuntu 24.04 (variant)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            UBUNTU_IMAGE=${{ steps.current.outputs.ubuntu2404 }}
          labels: |
            org.opencontainers.image.version=${{ inputs.release }}
            org.opencontainers.image.revision=aur-v${{ inputs.release }}
          tags: |
            cryptoandcoffee/k3d-gpu:${{ inputs.release }}-ubuntu24.04
            cryptoandcoffee/k3d-gpu:ubuntu24.04
            cryptoandcoffee/k3d-gpu:${{ steps.current.outputs.k3s }}-ubuntu24.04
            ghcr.io/${{ github.repository_owner }}/k3d-gpu:${{ inputs.release }}-ubuntu24.04
            ghcr.io/${{ github.repository_owner }}/k3d-gpu:ubuntu24.04
            ghcr.io/${{ github.repository_owner }}/k3d-gpu:${{ steps.current.outputs.k3s }}-ubuntu24.04

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.current.outputs.k3s }}-ndp${{ steps.current.outputs.plugin }}
          name: k3d-gpu ${{ steps.current.outputs.k3s }} (device-plugin ${{ steps.current.outputs.plugin }})
          body: |
            ## 🚀 k3d-gpu release

            Ubuntu node base — **26.04** (default) and **24.04**. k3s
            `${{ steps.current.outputs.k3s }}`, NVIDIA device plugin
            `${{ steps.current.outputs.plugin }}` (baked in — GPUs are
            exposed on `up` with no `kubectl apply`). Intel GPU plugin
            `v${{ steps.current.outputs.intel }}` (Arc, Battlemage, Core Ultra iGPU), Intel NPU plugin (same version) and Gaudi
            plugin `${{ steps.current.outputs.gaudi }}` (Gaudi 3 HPU) are baked in too.

            Launcher `k3d-gpu ${{ inputs.release }}` defaults to
            `cryptoandcoffee/k3d-gpu:${{ inputs.release }}`.

            **Docker Hub**
            - `cryptoandcoffee/k3d-gpu:${{ inputs.release }}` (= ubuntu26.04, pinned)
            - `cryptoandcoffee/k3d-gpu:${{ inputs.release }}-ubuntu24.04` (pinned)
            - `cryptoandcoffee/k3d-gpu:latest` (= ubuntu26.04, floats)
            - `cryptoandcoffee/k3d-gpu:ubuntu26.04`
            - `cryptoandcoffee/k3d-gpu:ubuntu24.04`

            **GHCR**
            - `ghcr.io/${{ github.repository_owner }}/k3d-gpu:${{ inputs.release }}`
            - `ghcr.io/${{ github.repository_owner }}/k3d-gpu:latest`
            - `ghcr.io/${{ github.repository_owner }}/k3d-gpu:ubuntu26.04`
            - `ghcr.io/${{ github.repository_owner }}/k3d-gpu:ubuntu24.04`

      - name: Dispatch AUR Deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run aur-deploy.yml --ref main -f version=${{ inputs.release }}

      - name: Dispatch deb, rpm and Homebrew release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run packages.yml --ref main -f version=${{ inputs.release }}

  # ─── Rendered components (hack/components/*) ─────────────────────────────
  # Each component is a pinned upstream chart rendered into a manifest under
  # share/, which the Dockerfile bakes into the image (nothing is fetched at
  # runtime). Daily: move each pin to the newest stable upstream release,
  # re-render with the pinned helm, run the tests, and open or update one PR per
  # component on branch autobump/<name>. Merging it changes share/** on main,
  # which auto-release.yml turns into a launcher release, and that release
  # dispatches the `release` job above to build the image. A PR opened with
  # GITHUB_TOKEN starts no CI workflows, so the tests run here before it opens.
  # A new component is a new hack/components/<name>/ dir; the matrix picks it up.
  list-components:
    if: ${{ !inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List components
        id: list
        run: echo "names=$(hack/render-component --list | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  bump-components:
    needs: list-components
    if: needs.list-components.outputs.names != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.list-components.outputs.names) }}
    env:
      COMPONENT: ${{ matrix.component }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned helm
        run: |
          hack/install-helm "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Move the pin to the newest upstream release and re-render
        id: render
        run: |
          out=$(hack/render-component --latest "$COMPONENT")
          echo "$out"
          # "rendered <name> <version> -> <output>"
          version=$(awk -v n="$COMPONENT" '$1 == "rendered" && $2 == n { print $3 }' <<< "$out")
          [ -n "$version" ] || { echo "::error::render-component reported no version for $COMPONENT"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git diff --stat

      - name: Re-pin images.lock for the new manifest
        run: |
          scripts/images-lock update
          scripts/images-lock check

      - name: Detection tests
        run: tests/detect_test.sh

      - name: Render tests
        run: tests/render_test.sh

      - name: Open or update the bump PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: autobump/${{ matrix.component }}
          delete-branch: true
          add-paths: |
            share/
            hack/components/${{ matrix.component }}/
            images.lock
          commit-message: "chore(${{ matrix.component }}): bump to ${{ steps.render.outputs.version }}"
          title: "chore(${{ matrix.component }}): bump to ${{ steps.render.outputs.version }}"
          labels: dependencies
          body: |
            Re-rendered `${{ matrix.component }}` from its pinned upstream at
            `${{ steps.render.outputs.version }}` with `hack/render-component --latest`.

            - Pins (version, chart sha256, image digests) moved in `hack/components/${{ matrix.component }}/component.conf`.
            - `tests/detect_test.sh` and `tests/render_test.sh` passed in the workflow run
              that opened this PR.
            - Merging rebuilds the node image with the new manifest baked in.

            Review the manifest diff for new CRDs, RBAC, images and flags before merging.

  # ─── Image digests ───────────────────────────────────────────────────────
  # Every image reference is pinned name:tag@sha256 (scripts/images-lock pins).
  # A registry can re-point a tag (a rebuilt base image, a security respin) with
  # no new tag, which the version checks above never see. Daily: re-resolve the
  # tag of every pinned reference, write the registry's digest where it moved,
  # re-pin images.lock, run the image tests, and open or update one PR on branch
  # autobump/image-digests. A PR opened with GITHUB_TOKEN starts no CI workflows,
  # so the tests run here before it opens. GITHUB_TOKEN cannot push a change to
  # .github/workflows/ (no `workflows` permission), so repin leaves those files
  # alone; a workflow reads its image pins from a file outside them (the
  # Dockerfile, docs-build/Dockerfile, hack/ci-images.env), which repin moves.
  repin-images:
    if: ${{ !inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Install pinned helm
        run: |
          hack/install-helm "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Move every digest a registry re-pointed
        id: repin
        run: |
          scripts/images-lock repin --exclude '.github/workflows/*' | tee "$RUNNER_TEMP/repin.txt"
          scripts/images-lock update
          scripts/images-lock check
          scripts/images-lock pins
          {
            echo "changes<<REPIN_EOF"
            cat "$RUNNER_TEMP/repin.txt"
            echo "REPIN_EOF"
          } >> "$GITHUB_OUTPUT"

      # A rendered component's image pins live in its component.conf (IMAGE_PINS);
      # repin moved them with the manifest, so the render must still match share/.
      - name: Committed manifests match their pinned render
        run: |
          git add -A
          hack/render-component
          git diff --exit-code -- share/ || { echo "::error::share/ differs from hack/render-component output after repin"; exit 1; }

      - name: Image pin, audit, detection and render tests
        run: |
          tests/image_pins_test.sh
          tests/audit_test.sh
          tests/detect_test.sh
          tests/render_test.sh

      - name: The digest PR changes no workflow file
        run: |
          changed=$(git status --porcelain -- .github/workflows/)
          [ -z "$changed" ] || { echo "::error::GITHUB_TOKEN cannot push .github/workflows/; this job changed:"; echo "$changed"; exit 1; }

      # create-pull-request resets an existing digest branch (a PR still open, or a
      # merged one whose branch stayed) onto main and force-pushes it. GitHub refuses
      # that push from GITHUB_TOKEN when the branch's workflow files differ from
      # main's, though the digest commit touches none. Deleting such a branch closes
      # its open PR; the action then cuts a fresh branch off main and opens a new one.
      - name: Delete a digest branch whose workflows differ from main's
        if: steps.repin.outputs.changes != ''
        run: |
          if git fetch -q --depth=1 origin autobump/image-digests 2>/dev/null \
             && ! git diff --quiet FETCH_HEAD HEAD -- .github/workflows/; then
            echo "autobump/image-digests was cut from a main with other workflow files; deleting it"
            git push origin --delete autobump/image-digests
          fi

      - name: Open or update the digest PR
        if: steps.repin.outputs.changes != ''
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: autobump/image-digests
          delete-branch: true
          commit-message: "chore(images): move the digests the registries re-pointed"
          title: "chore(images): move the digests the registries re-pointed"
          labels: dependencies
          body: |
            `scripts/images-lock repin` re-resolved the tag of every pinned image
            reference; these digests moved (same tag, new image):

            ```
            ${{ steps.repin.outputs.changes }}
            ```

            - `images.lock` re-pinned with `scripts/images-lock update`; `check` and `pins` pass.
            - `tests/image_pins_test.sh`, `tests/audit_test.sh`, `tests/detect_test.sh`,
              `tests/render_test.sh` and the render check passed in the workflow run that
              opened this PR.

            Review what the upstream rebuild changed before merging. A change under
            `share/`, `scripts/` or the Dockerfile cuts a launcher release on merge.

  # ─── QAT conversion toolchain (console/convert-pins.json) ──────────────────
  # The model optimizer's one-time OpenVINO conversion pins its pip toolchain
  # exactly. Daily: move each pin to the newest release optimum-intel's own
  # requirements allow (hack/bump-convert-pins), run the console tests, and open
  # or update one PR on branch autobump/convert-pins.
  bump-convert-pins:
    if: ${{ !inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Move the pins to the newest compatible releases
        id: bump
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check packaging==26.3
          "$RUNNER_TEMP/venv/bin/python" hack/bump-convert-pins | tee "$RUNNER_TEMP/bump.txt"
          # The moved set must resolve together: pip's resolver, no install.
          mapfile -t pins < <(jq -r '.pins | to_entries[] | "\(.key)==\(.value)"' console/convert-pins.json)
          "$RUNNER_TEMP/venv/bin/pip" install --dry-run --disable-pip-version-check "${pins[@]}"
          {
            echo "changes<<BUMP_EOF"
            cat "$RUNNER_TEMP/bump.txt"
            echo "BUMP_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Console and model optimizer tests
        run: |
          tests/console_test.sh
          tests/model_opt_test.sh

      - name: Open or update the pins PR
        if: steps.bump.outputs.changes != ''
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: autobump/convert-pins
          delete-branch: true
          add-paths: console/convert-pins.json
          commit-message: "chore(convert-pins): move the QAT conversion toolchain to its newest compatible releases"
          title: "chore(convert-pins): move the QAT conversion toolchain to its newest compatible releases"
          labels: dependencies
          body: |
            `hack/bump-convert-pins` moved these pins in `console/convert-pins.json`:

            ```
            ${{ steps.bump.outputs.changes }}
            ```

            `tests/console_test.sh` and `tests/model_opt_test.sh` passed in the workflow
            run that opened this PR.
