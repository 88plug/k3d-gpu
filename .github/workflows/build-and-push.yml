name: Auto-update, Build & Release

# Builds and publishes a launcher release's node image (the release job), when
# auto-release.yml dispatches it with `release=X.Y.Z`, or hack/watchdog does when a
# release tag has no image: build the image from tag aur-vX.Y.Z, publish
# <repo>:X.Y.Z (the launcher's default image), move the floating tags when X.Y.Z
# is the newest release, then dispatch aur-deploy.yml and packages.yml (deb, rpm,
# Homebrew) so the launcher reaches every package channel only once its image
# exists.
#
# The pins themselves move through pull requests: the Freshness workflow
# (freshness.yml, pins/registry.toml) opens one per group, with CI dispatched on
# it. Nothing here pushes to main.
#
# Every image is built from a release tag, so every published image has a
# launcher version. Pushes made with GITHUB_TOKEN start no workflow runs, but
# workflow_dispatch does, hence the explicit dispatches.
#
# Each release version queues on its own (one release never replaces another
# pending release).

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'launcher version X.Y.Z to build the image for (tag aur-vX.Y.Z must exist)'
        type: string
        default: ''

concurrency:
  group: build-and-push-${{ inputs.release && format('release-{0}', inputs.release) || 'nightly' }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  release:
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE: ${{ inputs.release }}
    steps:
      - name: Validate release version
        run: |
          [[ "$RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::release '$RELEASE' is not X.Y.Z"; exit 1; }

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: aur-v${{ inputs.release }}

      - name: Read pinned versions
        id: current
        run: |
          # The launcher in this tag defaults to <repo>:<VERSION>; build only for it.
          lv=$(sed -n 's/^VERSION="\(.*\)".*/\1/p' scripts/k3d-gpu)
          [ "$lv" = "$RELEASE" ] || { echo "::error::scripts/k3d-gpu VERSION '$lv' at aur-v$RELEASE is not '$RELEASE'"; exit 1; }
          {
            echo "k3s=$(grep '^ARG K3S_TAG' Dockerfile | cut -d= -f2 | tr -d '"')"
            echo "plugin=$(grep -oE 'k8s-device-plugin:v[0-9]+\.[0-9]+\.[0-9]+' share/nvidia-device-plugin.yml | cut -d: -f2)"
            echo "intel=$(grep -oE 'intel-gpu-plugin:[0-9]+\.[0-9]+\.[0-9]+' share/intel-gpu-plugin.yml | cut -d: -f2)"
            echo "gaudi=$(grep -oE 'gaudi-device-plugin:[0-9]+\.[0-9]+\.[0-9]+-[0-9]+' share/gaudi-device-plugin.yml | cut -d: -f2)"
          } >> "$GITHUB_OUTPUT"
          # The 24.04 variant's base, pinned in the Dockerfile where the nightly repin moves it.
          u=$(grep '^ARG UBUNTU_2404_IMAGE=' Dockerfile | cut -d= -f2 | tr -d '"')
          [[ "$u" =~ ^ubuntu:24\.04@sha256:[0-9a-f]{64}$ ]] || { echo "::error::Dockerfile at aur-v$RELEASE pins no ubuntu:24.04 UBUNTU_2404_IMAGE (got '$u')"; exit 1; }
          echo "ubuntu2404=$u" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DockerHub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A version tag is published once: a launcher release always names the same image.
      - name: Refuse to overwrite a published version tag
        env:
          IMAGE: cryptoandcoffee/k3d-gpu
        run: |
          if docker buildx imagetools inspect "$IMAGE:$RELEASE" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$RELEASE is already published; cut a new launcher release instead"
            exit 1
          fi

      # hack/release-tags comes from main: the release tag checked out above can
      # predate it (the watchdog re-dispatches an old release whose image is missing).
      - name: Checkout main's release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: .ci-main
          sparse-checkout: hack
          persist-credentials: false

      # The builds push the versioned tags (<repo>:X.Y.Z, -ubuntu26.04, -ubuntu24.04)
      # only; the floating tags move after both builds, below.
      - name: Tags to push
        id: tags
        env:
          K3S: ${{ steps.current.outputs.k3s }}
          RELEASE_REPOS: cryptoandcoffee/k3d-gpu ghcr.io/${{ github.repository_owner }}/k3d-gpu
        run: |
          tags=$(.ci-main/hack/release-tags "$RELEASE" "$K3S")
          printf '%s\n' "$tags"
          awk '$2 == "versioned" { print $1 }' <<< "$tags" | sort -u | while read -r v; do
            echo "v${v/./}<<TAGS_EOF"
            awk -v v="$v" '$1 == v && $2 == "versioned" { print $3 }' <<< "$tags"
            echo TAGS_EOF
          done >> "$GITHUB_OUTPUT"

      # Ubuntu 26.04 is the default (:latest and :X.Y.Z); 24.04 is also published.
      # Each carries the baked device plugins, so clusters expose GPUs with no apply.
      # Each variant builds in up to 3 attempts with the same inputs (a Docker Hub
      # 429 stopped release 0.1.76 with its tag cut and no image): attempts 1 and 2
      # continue on error and are followed by a 2 and a 4 min wait; attempt 3 fails
      # the job.
      - name: Build & push — Ubuntu 26.04 (attempt 1)
        id: b2604_1
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.version=${{ inputs.release }}
            org.opencontainers.image.revision=aur-v${{ inputs.release }}
          tags: ${{ steps.tags.outputs.v2604 }}

      - name: Wait 2 min before Ubuntu 26.04 attempt 2
        if: steps.b2604_1.outcome == 'failure'
        run: sleep 120

      - name: Build & push — Ubuntu 26.04 (attempt 2)
        id: b2604_2
        if: steps.b2604_1.outcome == 'failure'
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.version=${{ inputs.release }}
            org.opencontainers.image.revision=aur-v${{ inputs.release }}
          tags: ${{ steps.tags.outputs.v2604 }}

      - name: Wait 4 min before Ubuntu 26.04 attempt 3
        if: steps.b2604_2.outcome == 'failure'
        run: sleep 240

      - name: Build & push — Ubuntu 26.04 (attempt 3)
        id: b2604_3
        if: steps.b2604_2.outcome == 'failure'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.version=${{ inputs.release }}
            org.opencontainers.image.revision=aur-v${{ inputs.release }}
          tags: ${{ steps.tags.outputs.v2604 }}

      - name: Build & push — Ubuntu 24.04 (attempt 1)
        id: b2404_1
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            UBUNTU_IMAGE=${{ steps.current.outputs.ubuntu2404 }}
          labels: |
            org.opencontainers.image.version=${{ inputs.release }}
            org.opencontainers.image.revision=aur-v${{ inputs.release }}
          tags: ${{ steps.tags.outputs.v2404 }}

      - name: Wait 2 min before Ubuntu 24.04 attempt 2
        if: steps.b2404_1.outcome == 'failure'
        run: sleep 120

      - name: Build & push — Ubuntu 24.04 (attempt 2)
        id: b2404_2
        if: steps.b2404_1.outcome == 'failure'
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            UBUNTU_IMAGE=${{ steps.current.outputs.ubuntu2404 }}
          labels: |
            org.opencontainers.image.version=${{ inputs.release }}
            org.opencontainers.image.revision=aur-v${{ inputs.release }}
          tags: ${{ steps.tags.outputs.v2404 }}

      - name: Wait 4 min before Ubuntu 24.04 attempt 3
        if: steps.b2404_2.outcome == 'failure'
        run: sleep 240

      - name: Build & push — Ubuntu 24.04 (attempt 3)
        id: b2404_3
        if: steps.b2404_2.outcome == 'failure'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            UBUNTU_IMAGE=${{ steps.current.outputs.ubuntu2404 }}
          labels: |
            org.opencontainers.image.version=${{ inputs.release }}
            org.opencontainers.image.revision=aur-v${{ inputs.release }}
          tags: ${{ steps.tags.outputs.v2404 }}

      # The floating tags (latest, ubuntu26.04, ubuntu24.04, <k3s>-ubuntu26.04,
      # <k3s>-ubuntu24.04) move only when this release is the highest aur-v* tag on
      # origin now, after both variants pushed: releases build in parallel (one
      # queue per version), so an older one that finishes late leaves them alone.
      # Each is a registry-side copy of the versioned tag pushed above.
      - name: Move the floating tags (newest release only)
        env:
          K3S: ${{ steps.current.outputs.k3s }}
          RELEASE_REPOS: cryptoandcoffee/k3d-gpu ghcr.io/${{ github.repository_owner }}/k3d-gpu
        run: |
          tags=$(.ci-main/hack/release-tags "$RELEASE" "$K3S")
          n=0
          while read -r _ kind ref src; do
            [ "$kind" = floating ] || continue
            docker buildx imagetools create --tag "$ref" "$src"
            n=$((n + 1))
          done <<< "$tags"
          echo "moved $n floating tags"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.current.outputs.k3s }}-ndp${{ steps.current.outputs.plugin }}
          name: k3d-gpu ${{ steps.current.outputs.k3s }} (device-plugin ${{ steps.current.outputs.plugin }})
          body: |
            ## 🚀 k3d-gpu release

            Ubuntu node base — **26.04** (default) and **24.04**. k3s
            `${{ steps.current.outputs.k3s }}`, NVIDIA device plugin
            `${{ steps.current.outputs.plugin }}` (baked in — GPUs are
            exposed on `up` with no `kubectl apply`). Intel GPU plugin
            `v${{ steps.current.outputs.intel }}` (Arc, Battlemage, Core Ultra iGPU), Intel NPU plugin (same version) and Gaudi
            plugin `${{ steps.current.outputs.gaudi }}` (Gaudi 3 HPU) are baked in too.

            Launcher `k3d-gpu ${{ inputs.release }}` defaults to
            `cryptoandcoffee/k3d-gpu:${{ inputs.release }}`.

            **Docker Hub**
            - `cryptoandcoffee/k3d-gpu:${{ inputs.release }}` (= ubuntu26.04, pinned)
            - `cryptoandcoffee/k3d-gpu:${{ inputs.release }}-ubuntu24.04` (pinned)
            - `cryptoandcoffee/k3d-gpu:latest` (= ubuntu26.04, floats)
            - `cryptoandcoffee/k3d-gpu:ubuntu26.04`
            - `cryptoandcoffee/k3d-gpu:ubuntu24.04`

            **GHCR**
            - `ghcr.io/${{ github.repository_owner }}/k3d-gpu:${{ inputs.release }}`
            - `ghcr.io/${{ github.repository_owner }}/k3d-gpu:latest`
            - `ghcr.io/${{ github.repository_owner }}/k3d-gpu:ubuntu26.04`
            - `ghcr.io/${{ github.repository_owner }}/k3d-gpu:ubuntu24.04`

      - name: Dispatch AUR Deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run aur-deploy.yml --ref main -f version=${{ inputs.release }}

      - name: Dispatch deb, rpm and Homebrew release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run packages.yml --ref main -f version=${{ inputs.release }}
