name: Auto-release AUR

# Auto-tag a release on changes to packaging/, scripts/, share/ or the Dockerfile,
# and when build-and-push.yml's nightly check bumps upstream pins (dispatch).
# Tag format: aur-vX.Y.Z. The launcher at that tag defaults to node image
# cryptoandcoffee/k3d-gpu:X.Y.Z, so after tagging this dispatches build-and-push.yml
# with release=X.Y.Z; that run publishes the image and then dispatches aur-deploy.yml.
# Dispatches bypass the GITHUB_TOKEN downstream-trigger limit.
#
# hack/release_cas.sh releases from a fresh origin/main and pushes main and the
# tag in one atomic push (--atomic), retrying when another writer moved main or
# took the tag. On those lock and non-fast-forward races GitHub rejected both
# refs together in a branch-ref spike (not yet seen on a live release push); for
# other rejection classes a release commit can land
# without its tag, and the next run tags it in place. A push run whose commits
# an earlier run already released exits with no tag. The
# concurrency group only queues runs; correctness does not depend on it. Push and
# dispatch runs queue separately, so a pending forced dispatch is never replaced
# by a push run that finds nothing to release.

on:
  push:
    branches: [main]
    paths:
      - 'packaging/**'
      - 'scripts/**'
      - 'share/**'
      - 'Dockerfile'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  release:
    if: "github.actor != '88plug-bot' && !contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest
    concurrency:
      group: auto-release-${{ github.event_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0

      - name: Release (atomic push of main and the tag)
        id: rel
        env:
          EVENT: ${{ github.event_name }}
        run: |
          git config user.name  "88plug-bot"
          git config user.email "andrew@88plug.com"
          hack/release_cas.sh

      - name: Dispatch image build for the release
        if: steps.rel.outputs.ver != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.rel.outputs.ver }}
        run: gh workflow run build-and-push.yml --ref main -f release="$VER"
