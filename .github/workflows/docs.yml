name: Docs

# Builds the docs site (README.md, CONTRIBUTING.md, docs/*.md) with mkdocs
# --strict on every change, and publishes it to GitHub Pages from main.

on:
  push:
    branches: [main]
    paths:
      - README.md
      - CONTRIBUTING.md
      - 'docs/**'
      - 'docs-build/**'
      - mkdocs.yml
      - tests/docs_test.sh
      - .github/workflows/docs.yml
  pull_request:
    branches: [main]
    paths:
      - README.md
      - CONTRIBUTING.md
      - 'docs/**'
      - 'docs-build/**'
      - mkdocs.yml
      - tests/docs_test.sh
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (mkdocs --strict)
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    container:
      # docs-build/lock.sh reads this line to lock in the same interpreter.
      image: python:3.14.8-slim@sha256:a2b82f3c48559aa0a8446d9af49826b6e2b2016f4cd2afabfe6013ec53729170
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain (hash-locked)
        run: pip install --no-cache-dir --root-user-action=ignore --require-hashes -r docs-build/requirements.txt
      - name: Hook tests
        run: tests/docs_test.sh
      - name: Build
        run: mkdocs build --strict
      # Publish only once Pages is set to deploy from Actions (Settings > Pages >
      # Source: GitHub Actions). Until then main skips the deploy instead of failing.
      - name: Pages publishes from Actions?
        id: pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 docs-build/pages_enabled.py "$REPO"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    if: needs.build.outputs.pages == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
