name: Docs

# Builds the docs site (README.md, CONTRIBUTING.md, docs/*.md) with mkdocs
# --strict on every change, and publishes it to GitHub Pages from main.

on:
  push:
    branches: [main]
    paths:
      - README.md
      - CONTRIBUTING.md
      - 'docs/**'
      - 'docs-build/**'
      - mkdocs.yml
      - tests/docs_test.sh
      - .github/workflows/docs.yml
  pull_request:
    branches: [main]
    paths:
      - README.md
      - CONTRIBUTING.md
      - 'docs/**'
      - 'docs-build/**'
      - mkdocs.yml
      - tests/docs_test.sh
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The interpreter pin lives in docs-build/Dockerfile, where Dependabot and the
  # nightly repin move it (the nightly's token cannot push this workflow) and
  # docs-build/lock.sh reads it. A job's container image cannot come from a file
  # in that job, so this job reads it for the build job.
  image:
    name: Docs interpreter pin
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pin.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: docs-build
          persist-credentials: false
      - id: pin
        run: |
          ref=$(sed -n 's/^FROM \(python:[^ ]*\).*$/\1/p' docs-build/Dockerfile)
          [[ "$ref" =~ ^python:[^@]+@sha256:[0-9a-f]{64}$ ]] || { echo "::error::docs-build/Dockerfile has no pinned FROM python (got '$ref')"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  build:
    name: Build (mkdocs --strict)
    needs: image
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    container:
      image: ${{ needs.image.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain (hash-locked)
        run: pip install --no-cache-dir --root-user-action=ignore --require-hashes -r docs-build/requirements.txt
      - name: Hook tests
        run: tests/docs_test.sh
      - name: Build
        run: mkdocs build --strict
      # Publish only once Pages is set to deploy from Actions (Settings > Pages >
      # Source: GitHub Actions). Until then main skips the deploy instead of failing.
      - name: Pages publishes from Actions?
        id: pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 docs-build/pages_enabled.py "$REPO"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    if: needs.build.outputs.pages == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
