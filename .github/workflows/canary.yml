name: Canary

# Every engine or node-image bump, from a bot or a human, checked at runtime before it
# merges (canary/README.md):
#   runtime  vllm-cpu, ovms-cpu, llama-cpu (and eat-vllm-cpu, informational): pull the
#            pinned image, serve a pinned 0.6B model the way the launcher would, one real
#            and one streamed completion, the version the server reports;
#   surface  every engine image: the flags and env names the launcher emits exist in it,
#            and the constants k3d-gpu derives from it still match (no device needed);
#   node     build the node image, start a k3d cluster on it, everything baked comes up.
# A pull request or `engines=auto` runs the engines whose pin, flags, settings or golden
# differ from merge-base(origin/main, HEAD), or from the pull request's base branch
# (canary/plan.py matrix); the schedule runs all.
# The report job writes canary-result.json (artifact canary-result) and is green only when
# every selected engine's verdict is pass with hard true.
#
# Read-only: no secrets, no registry login (public images), GitHub-hosted runners only.
# Two jobs may write, each only to dispatch a workflow: re-dispatch starts this workflow
# again (attempt + 1, at most 3) when an engine was isa-skip, the runner's CPU lacking an
# instruction set it needs; sweep starts bot-sweep.yml after a run dispatched on autobump/*.

on:
  schedule:
    - cron: '29 3 * * *'
  workflow_dispatch:
    inputs:
      engines:
        description: 'engine ids from canary/engines.toml, comma separated, or auto (the engines that differ from main)'
        type: string
        default: auto
      attempt:
        description: 'attempt number: an isa-skip re-dispatches with attempt + 1, at most 3'
        type: number
        default: 1
  pull_request:
    paths:
      - Dockerfile
      - scripts/k3d-gpu
      - 'share/**'
      - console/moe_predict.py
      - console/plan.py
      - console/model_opt.py
      - console/fit.py
      - bench/h54/h54.py # sglang_args, the sglang flags the surface check reads
      - 'canary/**'
      - packaging/install.sh
      - integrations/eat/vllm-values.yaml
      - .github/workflows/canary.yml

permissions:
  contents: read

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      runtime: ${{ steps.plan.outputs.runtime }}
      surface: ${{ steps.plan.outputs.surface }}
      node: ${{ steps.plan.outputs.node }}
      selected: ${{ steps.plan.outputs.selected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # merge-base(origin/main, HEAD)
          persist-credentials: false
      # auto: against merge-base(origin/<the pull request's base, else main>, HEAD)
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          ENGINES: ${{ inputs.engines }}
          BASE: ${{ github.base_ref || 'main' }}
        run: |
          mode=auto
          [ "$EVENT" != schedule ] || mode=all
          python3 canary/plan.py matrix --mode "$mode" --engines "${ENGINES:-auto}" --base "origin/$BASE" \
            --github-output "$GITHUB_OUTPUT"

  runtime:
    name: Runtime (${{ matrix.id }})
    needs: plan
    if: needs.plan.outputs.runtime != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.runtime) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The model at its pinned revision; canary/run.sh downloads it on a miss.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.cache_path }}
          key: ${{ matrix.cache_key }}
      - name: canary/run.sh
        env:
          ID: ${{ matrix.id }}
          CANARY_FREE_DISK: '1'
          CANARY_OUT_DIR: ${{ runner.temp }}/canary-out
        run: canary/run.sh "$ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: canary-part-${{ matrix.id }}
          path: ${{ runner.temp }}/canary-out/
          if-no-files-found: ignore
          retention-days: 14

  surface:
    name: Surface (${{ matrix.id }})
    needs: plan
    if: needs.plan.outputs.surface != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.surface) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: canary/run.sh --surface
        env:
          ID: ${{ matrix.id }}
          CANARY_FREE_DISK: '1'
          CANARY_OUT_DIR: ${{ runner.temp }}/canary-out
        run: canary/run.sh --surface "$ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: canary-part-${{ matrix.id }}
          path: ${{ runner.temp }}/canary-out/
          if-no-files-found: ignore
          retention-days: 14

  node:
    name: Node image
    needs: plan
    if: needs.plan.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: canary/node.sh
        env:
          CANARY_OUT_DIR: ${{ runner.temp }}/canary-out
        run: canary/node.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: canary-part-node
          path: ${{ runner.temp }}/canary-out/
          if-no-files-found: ignore
          retention-days: 14

  report:
    name: Report
    needs: [plan, runtime, surface, node]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      isa_skip: ${{ steps.report.outputs.isa_skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: canary-part-*
          merge-multiple: true
          path: ${{ runner.temp }}/parts
      - id: report
        env:
          SELECTED: ${{ needs.plan.outputs.selected }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/parts"
          rc=0
          python3 canary/plan.py report --selected "$SELECTED" --parts "$RUNNER_TEMP/parts" --sha "$SHA" --ref "$REF" \
            --out canary-result.json --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-result
          path: canary-result.json
          retention-days: 30
      - name: Green only when every selected engine passed
        env:
          RC: ${{ steps.report.outputs.rc }}
        run: exit "${RC:-1}"

  redispatch:
    name: Re-dispatch isa-skip engines
    needs: report
    if: >-
      always() && needs.report.outputs.isa_skip != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.head_ref || github.ref_name }}
          ENGINES: ${{ needs.report.outputs.isa_skip }}
          ATTEMPT: ${{ inputs.attempt || 1 }}
        run: |
          if [ "$ATTEMPT" -ge 3 ]; then
            echo "::warning::$ENGINES isa-skip on attempt $ATTEMPT of 3: no runner with the instruction set it needs; the canary stays not green"
            exit 0
          fi
          gh workflow run canary.yml --repo "$REPO" --ref "$REF" -f engines="$ENGINES" -f attempt="$((ATTEMPT + 1))"

  # A run dispatched on autobump/* (a bot PR's canary) is evidence bot-sweep.yml acts
  # on, and a run dispatched with GITHUB_TOKEN starts no workflow_run, so the sweep
  # would wait for its hourly cron, which GitHub starts hours apart here. After
  # every other job this one dispatches the sweep with after_run set to this run's id;
  # the sweep waits for this run to complete before it reads it. It never fails the
  # canary (continue-on-error, exit 0). The step is ci.yml's job sweep's step.
  sweep:
    name: Hand off to the bot sweep
    needs: [plan, runtime, surface, node, report, redispatch]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/autobump/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Dispatch bot-sweep.yml, which waits for this run to complete
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # GITHUB_TOKEN: 1,000 REST requests an hour for the repository, every workflow's;
          # a sweep reads about 10 per open bot PR. GET /rate_limit costs none.
          left=$(gh api rate_limit --jq .resources.core.remaining 2>/dev/null) || left=
          if [[ $left =~ ^[0-9]+$ ]] && [ "$left" -lt 500 ]; then
            echo "::notice::$left GITHUB_TOKEN requests left this hour; no hand-off, the next scheduled sweep reads this run"
            exit 0
          fi
          for n in 1 2 3; do
            if gh workflow run bot-sweep.yml --ref main -f after_run="$RUN_ID"; then
              echo "dispatched bot-sweep.yml with after_run=$RUN_ID"
              exit 0
            fi
            if [ "$n" -lt 3 ]; then sleep $((10 * n)); fi
          done
          echo "::warning::could not dispatch bot-sweep.yml; its next scheduled run reads this run"
