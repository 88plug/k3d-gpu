# Hybrid P-core / E-core NRI balloons profile for Intel's Enterprise Agent Toolkit
# (EAT) on a k3d-gpu cluster. Values for the nri-resource-policy-balloons chart v0.14.0
# (https://containers.github.io/nri-plugins), installed under the release name EAT
# uses, so EAT's own role sees the same release:
#
#   K3D_GPU_BALLOONS=external k3d-gpu up
#   helm upgrade --install nri-resource-policy-balloons nri-resource-policy-balloons \
#     --repo https://containers.github.io/nri-plugins --version v0.14.0 \
#     --namespace kube-system -f contrib/eat/hybrid-values.yaml
#
# (Helm 3 or 4, no extra flag.) On a cluster created without external, first touch
# nri-balloons.yaml.skip in the server's manifests dir and add --force (Helm 3) or
# --force-conflicts (Helm 4); the README explains why.
#
# Then set deploy_nri_balloon_policy=no in EAT's agentic-config.cfg, so EAT does not
# reinstall the chart with its single-type Xeon policy. That also turns EAT's
# balloon_policy_cpu off: EAT skips CPU topology detection and deploys vLLM without
# its cpu_balloon_annotation, cpu, memory and tensor/pipeline_parallel_size --set
# flags. vLLM still matches vllm-balloon by its container name, but its sizing comes
# from the defaults in EAT's xeon_values_file; set them there.
#
# Helm prints "warning: skipped value for nri-resource-policy-balloons.nodeSelector:
# Not a table." because the chart's default nodeSelector is []. It is harmless: the
# DaemonSet still gets k3d-gpu.io/hybrid-cpu: "true".
#
# Balloon types (first match wins):
#   reserved             kube-system, on E-cores
#   vllm-balloon         EAT's vLLM pods (container "vllm", or the annotation
#                        balloon.balloons.resource-policy.nri.io: vllm-balloon), on P-cores
#   performance, efficient, lowpower, ecluster, pcore-physical, latency
#                        pods labelled k3d-gpu.io/cores=<type>, the same types as the
#                        baked share/nri-balloons.yml (see docs/intel.md)
#   agent-control-plane  EAT's agent services, on E-cores (namespaces from EAT @0ecf67a:
#                        genai-gateway = LiteLLM + Langfuse, deploy-genai-gateway.yml;
#                        redis, redis-controller.sh; pgvector, pgvector-controller.sh;
#                        agent-sandbox-system, inference_agent_sandbox.yml;
#                        openshell-system + openshell-sandboxes, inference_openshell.yml;
#                        flowise, agenticai-plugin-vars.yml)
#   shared               everything else, one balloon on every idle CPU
# EAT's own policy puts every non-vLLM pod in "reserved" (namespaces: ["*"]); this
# profile drops that so unlabelled pods keep the rest of the machine.
#
# With K3D_GPU_BALLOONS=external, up does not edit this release. Two edits it makes
# to the baked policy are then yours to add, if the host needs them:
#   Arrow Lake-H (LP E-cores in /sys/devices/cpu_lowpower): nri-plugins v0.14.0 will
#     not start unless those CPUs join the E-core kind. Add
#     --set-string extraEnv.OVERRIDE_SYS_ATOM_CPUS=<cpu_atom + cpu_lowpower list>.
#   Favored cores (k3d-gpu doctor prints "favored CPUs"): add each favored core's L2
#     dir, e.g. /sys/devices/system/cpu/cpu8/cache/index2, to the latency type's
#     preferCloseToDevices.
nodeSelector:
  k3d-gpu.io/hybrid-cpu: "true"
config:
  reservedResources:
    cpu: 1000m
  agent:
    nodeResourceTopology: true
    podResourceAPI: false
  allocatorTopologyBalancing: true
  pinCPU: true
  pinMemory: false
  reservedPoolNamespaces: [kube-system]
  loadClasses:
  - {name: ecluster-l2, level: l2cache}
  balloonTypes:
  - name: reserved
    preferCoreType: efficient
  - name: vllm-balloon
    preferCoreType: performance
    allocatorPriority: high
    minCPUs: 1
    maxCPUs: 1024
    matchExpressions:
    - {key: name, operator: In, values: [vllm]}
  - name: performance
    preferCoreType: performance
    matchExpressions:
    - {key: pod/labels/k3d-gpu.io/cores, operator: Equals, values: [performance]}
  - name: efficient
    preferCoreType: efficient
    matchExpressions:
    - {key: pod/labels/k3d-gpu.io/cores, operator: Equals, values: [efficient]}
  - name: lowpower
    preferCoreType: efficient
    matchExpressions:
    - {key: pod/labels/k3d-gpu.io/cores, operator: Equals, values: [lowpower]}
  - name: ecluster
    preferCoreType: efficient
    minCPUs: 4
    maxCPUs: 4
    loads: [ecluster-l2]
    matchExpressions:
    - {key: pod/labels/k3d-gpu.io/cores, operator: Equals, values: [ecluster]}
  - name: pcore-physical
    preferCoreType: performance
    preferSpreadOnPhysicalCores: false
    hideHyperthreads: true
    matchExpressions:
    - {key: pod/labels/k3d-gpu.io/cores, operator: Equals, values: [pcore-physical]}
  - name: latency
    preferCoreType: performance
    preferSpreadOnPhysicalCores: false
    hideHyperthreads: true
    maxCPUs: 2
    matchExpressions:
    - {key: pod/labels/k3d-gpu.io/cores, operator: Equals, values: [latency]}
  - name: agent-control-plane
    preferCoreType: efficient
    minCPUs: 2
    maxBalloons: 1
    namespaces:
    - genai-gateway
    - redis
    - pgvector
    - agent-sandbox-system
    - openshell-system
    - openshell-sandboxes
    - flowise
  - name: shared
    shareIdleCPUsInSame: system
    maxBalloons: 1
    matchExpressions:
    - {key: name, operator: AlwaysTrue}
  log:
    debug: [none]
