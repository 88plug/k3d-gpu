# nfpm config for the k3d-gpu .deb and .rpm (https://nfpm.goreleaser.com/docs/configuration/).
# Same payload as packaging/aur/PKGBUILD. Build from the repo root:
#   VERSION=0.1.7 nfpm package --config packaging/nfpm/nfpm.yaml --packager deb --target dist/
# CI pins the nfpm image in .github/workflows/packages.yml and ci.yml.
name: k3d-gpu
arch: all
platform: linux
version: ${VERSION}
release: 1
section: admin
priority: optional
maintainer: Andrew Mello <andrew@88plug.com>
vendor: 88plug
homepage: https://github.com/88plug/k3d-gpu
license: FSL-1.1-ALv2
description: |-
  Bootstrap GPU-ready k3d clusters on Docker.
  Launcher plus device plugin manifests for NVIDIA, Intel GPU/iGPU/NPU/Gaudi,
  Xeon DSA/IAA/QAT/AMX and hybrid P/E-core pinning. Needs docker, k3d and kubectl.
depends:
  - bash
suggests:
  - python3  # k3d-gpu facts, plan, tune and capacity (console/, bench/)
contents:
  - src: scripts/k3d-gpu
    dst: /usr/bin/k3d-gpu
    file_info:
      mode: 0755
  - src: share/*.yml
    dst: /usr/share/k3d-gpu/
    file_info:
      mode: 0644
  - src: share/telemetry/*.yml
    dst: /usr/share/k3d-gpu/telemetry/
    file_info:
      mode: 0644
  - src: share/telemetry/optional/*.yml
    dst: /usr/share/k3d-gpu/telemetry/optional/
    file_info:
      mode: 0644
  - src: console/*.py
    dst: /usr/share/k3d-gpu/console/
    file_info:
      mode: 0644
  - src: console/*.json
    dst: /usr/share/k3d-gpu/console/
    file_info:
      mode: 0644
  - src: images.lock
    dst: /usr/share/k3d-gpu/images.lock
    file_info:
      mode: 0644
  # k3d-gpu tune loads the agent with these.
  - src: bench/llm_load.py
    dst: /usr/share/k3d-gpu/bench/llm_load.py
    file_info:
      mode: 0755
  - src: bench/energy.sh
    dst: /usr/share/k3d-gpu/bench/energy.sh
    file_info:
      mode: 0755
  # k3d-gpu capacity runs these.
  - src: bench/agent_trace.py
    dst: /usr/share/k3d-gpu/bench/agent_trace.py
    file_info:
      mode: 0644
  - src: bench/agent_trace_gen.py
    dst: /usr/share/k3d-gpu/bench/agent_trace_gen.py
    file_info:
      mode: 0644
  - src: bench/apb/apb.py
    dst: /usr/share/k3d-gpu/bench/apb/apb.py
    file_info:
      mode: 0644
  - src: bench/apb/capacity.py
    dst: /usr/share/k3d-gpu/bench/apb/capacity.py
    file_info:
      mode: 0644
  - src: oracle/bundle.py
    dst: /usr/share/k3d-gpu/oracle/bundle.py
    file_info:
      mode: 0644
  - src: oracle/project.py
    dst: /usr/share/k3d-gpu/oracle/project.py
    file_info:
      mode: 0644
  - src: oracle/validate.py
    dst: /usr/share/k3d-gpu/oracle/validate.py
    file_info:
      mode: 0644
  - src: oracle/share.py
    dst: /usr/share/k3d-gpu/oracle/share.py
    file_info:
      mode: 0644
  - src: oracle/schema/bundle-v1.json
    dst: /usr/share/k3d-gpu/oracle/schema/bundle-v1.json
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/k3d-gpu/README.md
    file_info:
      mode: 0644
  - src: LICENSE.md
    dst: /usr/share/doc/k3d-gpu/copyright
    packager: deb
    file_info:
      mode: 0644
  - src: LICENSE.md
    dst: /usr/share/licenses/k3d-gpu/LICENSE.md
    packager: rpm
    file_info:
      mode: 0644
  # rpm removes only the directories a package owns; deb prunes empty ones itself.
  - dst: /usr/share/k3d-gpu
    type: dir
    packager: rpm
    file_info:
      mode: 0755
  - dst: /usr/share/k3d-gpu/telemetry
    type: dir
    packager: rpm
    file_info:
      mode: 0755
  - dst: /usr/share/k3d-gpu/telemetry/optional
    type: dir
    packager: rpm
    file_info:
      mode: 0755
  - dst: /usr/share/k3d-gpu/bench
    type: dir
    packager: rpm
    file_info:
      mode: 0755
  - dst: /usr/share/k3d-gpu/bench/apb
    type: dir
    packager: rpm
    file_info:
      mode: 0755
  - dst: /usr/share/k3d-gpu/oracle
    type: dir
    packager: rpm
    file_info:
      mode: 0755
  - dst: /usr/share/k3d-gpu/oracle/schema
    type: dir
    packager: rpm
    file_info:
      mode: 0755
  - dst: /usr/share/k3d-gpu/console
    type: dir
    packager: rpm
    file_info:
      mode: 0755
  - dst: /usr/share/doc/k3d-gpu
    type: dir
    packager: rpm
    file_info:
      mode: 0755
  - dst: /usr/share/licenses/k3d-gpu
    type: dir
    packager: rpm
    file_info:
      mode: 0755
