apiVersion: apps/v1
kind: Deployment
metadata:
  name: ovms-model-server
  namespace: default
  labels:
    helm.sh/chart: ovms-model-server-0.1.0
    app.kubernetes.io/name: ovms-model-server
    app.kubernetes.io/instance: ovms-model-server
    app: ovms-model-server
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ovms-model-server
      app.kubernetes.io/instance: ovms-model-server
      app: ovms-model-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ovms-model-server
        app.kubernetes.io/instance: ovms-model-server
        app: ovms-model-server
    spec:
      
      securityContext:
        fsGroup: 5000
        runAsNonRoot: true
        runAsUser: 5000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      # Init container to download model from HuggingFace
      - name: model-downloader
        image: "openvino/model_server:2025.4@sha256:c370720007564bbdcbca13b9b714e4537068542cda512e8095259e66b617962a"
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 5000
        command: ["/bin/sh", "-c"]
        args:
        - |
          MODEL_PATH="/models/OpenVINO/gemma-4-26b-a4b-it-int4-ov"
          
          # Check if model already exists (for persistent storage)
          if [ -d "$MODEL_PATH" ] && [ "$(ls -A $MODEL_PATH 2>/dev/null)" ]; then
            echo "======================================"
            echo "✅ Model already exists, skipping download"
            echo "Model path: $MODEL_PATH"
            echo "======================================"
            echo "Existing files:"
            ls -lah "$MODEL_PATH/"
            # Ensure config.json exists for OpenVINO models
            if [ ! -f "/models/config.json" ]; then
              echo "Creating /models/config.json..."
              printf '{"model_config_list":[{"config":{"name":"OpenVINO/gemma-4-26b-a4b-it-int4-ov","base_path":"/models/OpenVINO/gemma-4-26b-a4b-it-int4-ov"}}]}' > /models/config.json
            fi
            echo "config.json:"
            cat /models/config.json
            exit 0
          fi
          
          echo "======================================"
          echo "Downloading model from HuggingFace"
          echo "Source: OpenVINO/gemma-4-26b-a4b-it-int4-ov"
          echo "======================================"
          # OpenVINO models are public, no token needed
          # ovms --pull downloads model and creates graph.pbtxt inside model dir
          /ovms/bin/ovms \
            --pull \
            --source_model=OpenVINO/gemma-4-26b-a4b-it-int4-ov \
            --model_repository_path=/models \
            --target_device=CPU \
            --task=text_generation \
            --cache_size=20
          
          # Create config.json at /models/config.json for OVMS to use
          # This points to the graph.pbtxt created by ovms --pull
          echo "Creating /models/config.json for model serving..."
          cat > /models/config.json << 'CONFIGEOF'
          {
            "model_config_list": [
              {
                "config": {
                  "name": "OpenVINO/gemma-4-26b-a4b-it-int4-ov",
                  "base_path": "/models/OpenVINO/gemma-4-26b-a4b-it-int4-ov"
                }
              }
            ]
          }
          CONFIGEOF
          echo "Generated config.json:"
          cat /models/config.json

          echo ""
          echo "✅ Model downloaded successfully!"
          echo "Downloaded files:"
          ls -lah /models/OpenVINO/gemma-4-26b-a4b-it-int4-ov/
        volumeMounts:
        - name: model-storage
          mountPath: /models
        resources:
          limits:
            cpu: "8"
            memory: 50Gi
          requests:
            cpu: "4"
            memory: 50Gi
      containers:
      - name: ovms
        image: "openvino/model_server:2025.4@sha256:c370720007564bbdcbca13b9b714e4537068542cda512e8095259e66b617962a"
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 5000
        args:
        # LLM serving mode for text generation (chat/completions API) - OpenVINO models
        # Use config_path since ovms --pull creates config.json with graph.pbtxt
        - "--config_path=/models/config.json"
        - "--rest_port=8081"
        - "--port=8080"
        - "--log_level=INFO"
        ports:
        - containerPort: 8080
          name: grpc
          protocol: TCP
        - containerPort: 8081
          name: rest
          protocol: TCP
        volumeMounts:
        - name: model-storage
          mountPath: /models
          # OpenVINO models need write access for model repository creation
          readOnly: false
        resources:
          limits:
            cpu: "12"
            memory: 24Gi
          requests:
            cpu: "12"
            memory: 16Gi
        livenessProbe:
          httpGet:
            path: /v2/health/live
            port: 8081
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /v2/health/ready
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
      volumes:
      - name: model-storage
        
        persistentVolumeClaim:
          claimName: ovms-model-server
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: ei-infra-eligible
                operator: In
                values:
                - "true"
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
          operator: Exists
