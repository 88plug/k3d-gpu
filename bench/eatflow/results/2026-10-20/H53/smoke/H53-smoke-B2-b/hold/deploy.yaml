apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-qwen38-27b-xpu-config
  labels:
    helm.sh/chart: vllm-0-latest
    app.kubernetes.io/name: vllm
    app.kubernetes.io/instance: vllm-qwen38-27b-xpu
    app.kubernetes.io/version: '0.5'
    app.kubernetes.io/managed-by: Helm
data:
  http_proxy: ''
  https_proxy: ''
  no_proxy: ''
  TORCHINDUCTOR_CACHE_DIR: /tmp
  NUMBA_CACHE_DIR: /tmp
  HF_HOME: /data
  OUTLINES_CACHE_DIR: /tmp/.cache/outlines
  VLLM_NO_USAGE_STATS: '1'
  DO_NOT_TRACK: '1'
  CCL_ALLREDUCE: ring
  CCL_PROCESS_LAUNCHER: none
  CCL_WORKER_AFFINITY: ''
  CCL_WORKER_OFFLOAD: '0'
  CCL_ZE_IPC_EXCHANGE: pidfd
  HF_ENDPOINT: https://huggingface.co
  HF_HUB_DISABLE_XET: '1'
  HF_HUB_ENABLE_HF_TRANSFER: '0'
  HOME: /tmp
  LOGNAME: vllm
  ONEAPI_DEVICE_SELECTOR: level_zero:*
  SYCL_CACHE_PERSISTENT: '1'
  TORCH_LLM_ALLREDUCE: '1'
  TRITON_CACHE_DIR: /tmp/.triton
  TRITON_HOME: /tmp/.triton
  USER: vllm
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: '1'
  VLLM_ATTENTION_BACKEND: TORCH_SDPA
  VLLM_TARGET_DEVICE: xpu
  VLLM_USE_V1: '1'
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  XDG_CACHE_HOME: /tmp/.cache
  ZES_ENABLE_SYSMAN: '1'
  ZE_ENABLE_PCI_ID_DEVICE_ORDER: '1'
  ZE_FLAT_DEVICE_HIERARCHY: FLAT
  HF_HUB_OFFLINE: '1'
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen38-27b-xpu-service
  labels:
    helm.sh/chart: vllm-0-latest
    app.kubernetes.io/name: vllm
    app.kubernetes.io/instance: vllm-qwen38-27b-xpu
    app.kubernetes.io/version: '0.5'
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: vllm
  selector:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/instance: vllm-qwen38-27b-xpu
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen38-27b-xpu
  labels:
    helm.sh/chart: vllm-0-latest
    app.kubernetes.io/name: vllm
    app.kubernetes.io/instance: vllm-qwen38-27b-xpu
    app.kubernetes.io/version: '0.5'
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
      app.kubernetes.io/instance: vllm-qwen38-27b-xpu
  template:
    metadata:
      annotations: null
      labels:
        app.kubernetes.io/name: vllm
        app.kubernetes.io/instance: vllm-qwen38-27b-xpu
    spec:
      securityContext:
        fsGroup: 1001
        supplementalGroups:
        - 990
        - 44
      containers:
      - name: vllm
        envFrom:
        - configMapRef:
            name: vllm-qwen38-27b-xpu-config
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - SYS_NICE
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: false
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault
        image: vllm/vllm-openai-xpu:v0.28.0@sha256:4756b66a077627133cee653b551f6f5eaa1b9a981b5eea13edd33fcd3b0d3ca3
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        - python3 -m vllm.entrypoints.openai.api_server "$@"
        - --
        args:
        - --host
        - 0.0.0.0
        - --dtype
        - float16
        - --block-size
        - '64'
        - --gpu-memory-utilization
        - '0.9'
        - --enforce-eager
        - --no-enable-prefix-caching
        - --trust-remote-code
        - --disable-sliding-window
        - --enable-auto-tool-choice
        - --tool-call-parser
        - qwen3_xml
        - --tensor-parallel-size
        - '4'
        - --model
        - /data/Qwen3.8-27B
        - --served-model-name
        - Qwen/Qwen3.6-27B
        - --port
        - '8000'
        volumeMounts:
        - mountPath: /data
          name: model-volume
        - mountPath: /dev/shm
          name: shm
        - mountPath: /tmp
          name: tmp
        - mountPath: /root/.cache/vllm
          name: vllm-cache
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        readinessProbe:
          failureThreshold: 200
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          limits:
            gpu.intel.com/xe: '4'
      volumes:
      - name: model-volume
        hostPath:
          path: /var/apb-ro
          type: Directory
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: tmp
        emptyDir: {}
      - name: vllm-cache
        emptyDir: {}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: ei-inference-eligible
                operator: In
                values:
                - 'true'
