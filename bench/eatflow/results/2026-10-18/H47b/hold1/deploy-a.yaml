---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ovms
  namespace: k3d-gpu-agent
  labels:
    app: ovms
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ovms
  template:
    metadata:
      labels:
        app: ovms
        k3d-gpu.io/cores: performance
      annotations:
        k3d-gpu.io/agent-device: CPU
    spec:
      securityContext:
        runAsUser: 5000
        runAsGroup: 5000
        fsGroup: 5000
      containers:
      - name: ovms
        image: openvino/model_server@sha256:a928903fe429f1e3e27107cc45932d30d95febfd2d1159dc50869c3eac76fc58
        imagePullPolicy: IfNotPresent
        args:
        - --rest_port=8000
        - --cache_dir=/models/.ov_cache
        - --log_level=INFO
        - --config_path=/graphs/config.json
        ports:
        - name: http
          containerPort: 8000
        readinessProbe:
          httpGet:
            path: /v2/health/ready
            port: http
          periodSeconds: 5
        resources:
          requests:
            cpu: '16'
            memory: 6Gi
        volumeMounts:
        - name: models
          mountPath: /models
        - name: graphs
          mountPath: /graphs
      volumes:
      - name: models
        hostPath:
          path: /var/apb-models
          type: Directory
      - name: graphs
        configMap:
          name: ovms-graphs
---
apiVersion: v1
kind: Service
metadata:
  name: ovms
  namespace: k3d-gpu-agent
spec:
  selector:
    app: ovms
  ports:
  - name: http
    port: 8000
    targetPort: http
