apiVersion: v1
kind: Namespace
metadata:
  name: k3d-gpu-agent
---
# Models and the compiled-model cache live here, so restarts never re-download.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ovms-models
  namespace: k3d-gpu-agent
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ovms
  namespace: k3d-gpu-agent
  labels:
    app: ovms
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ovms
  template:
    metadata:
      labels:
        app: ovms
        k3d-gpu.io/cores: performance
      annotations:
        k3d-gpu.io/agent-device: CPU
    spec:
      securityContext:
        runAsUser: 5000
        runAsGroup: 5000
        fsGroup: 5000
      initContainers:
        # --pull downloads the model once and writes its graph.pbtxt (device,
        # parsers). On later starts the files are already there and only the
        # graph is rewritten, so a device change takes effect with no download.
        - name: pull
          image: openvino/model_server@sha256:a928903fe429f1e3e27107cc45932d30d95febfd2d1159dc50869c3eac76fc58
          imagePullPolicy: IfNotPresent
          args:
            - --pull
            - --source_model=k3dgpu/Qwen3-4B-Instruct-2507-int4-ov
            - --model_repository_path=/models
            - --model_name=qwen3-4b-instruct-2507
            - --task=text_generation
            - --target_device=CPU
            - --draft_source_model=OpenVINO/Qwen3-0.6B-int4-ov
            - --draft_device=CPU
            - --tool_parser=hermes3
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: ovms
          image: openvino/model_server@sha256:a928903fe429f1e3e27107cc45932d30d95febfd2d1159dc50869c3eac76fc58
          imagePullPolicy: IfNotPresent
          args:
            - --rest_port=8000
            - --model_path=/models/k3dgpu/Qwen3-4B-Instruct-2507-int4-ov
            - --model_name=qwen3-4b-instruct-2507
            - --cache_dir=/models/.ov_cache
            - --log_level=INFO
          ports:
            - name: http
              containerPort: 8000
          # No liveness probe: compiling a model for a GPU takes minutes.
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: "16"
              memory: 6Gi
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ovms-models
---
apiVersion: v1
kind: Service
metadata:
  name: ovms
  namespace: k3d-gpu-agent
spec:
  selector:
    app: ovms
  ports:
    - name: http
      port: 8000
      targetPort: http
