# APB arm 4: vLLM (CUDA) on the RTX 4000 SFF Ada through k3d-gpu's NVIDIA path.
# Placeholders are filled by PROTOCOL.md step A4 (sed), never edited by hand:
#   @VLLM_IMAGE@  vllm/vllm-openai pinned by digest
#   @GPU_UUID@    the RTX 4000's UUID from `nvidia-smi --query-gpu=uuid`
# The pod takes both host GPUs (nvidia.com/gpu: 2) so nothing else lands on
# them during the run, and CUDA_VISIBLE_DEVICES keeps vLLM on the RTX 4000.
apiVersion: v1
kind: Namespace
metadata:
  name: apb-vllm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: apb-vllm
spec:
  replicas: 1
  selector:
    matchLabels: {app: vllm}
  template:
    metadata:
      labels: {app: vllm}
    spec:
      # The Service is named vllm, so service links would set VLLM_PORT=tcp://IP:8000
      # in the pod, which vLLM v0.31.0 reads as its own setting and refuses at
      # engine start ("VLLM_PORT ... appears to be a URI", vllm/envs.py get_vllm_port).
      enableServiceLinks: false
      runtimeClassName: nvidia
      containers:
        - name: vllm
          image: "@VLLM_IMAGE@"
          args:
            - --model=Qwen/Qwen3-4B-AWQ
            - --revision=74d4bd2bd4bff9cafc9345221320bffb08b406a3
            - --served-model-name=Qwen/Qwen3-4B-AWQ
            - --max-model-len=32768
            - --gpu-memory-utilization=0.85
            - --enable-prompt-tokens-details
            - --enable-auto-tool-choice
            - --tool-call-parser=hermes
            - --port=8000
          env:
            - {name: CUDA_VISIBLE_DEVICES, value: "@GPU_UUID@"}
            - {name: HF_HOME, value: /cache}
          ports:
            - {name: http, containerPort: 8000}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 180
          resources:
            limits:
              nvidia.com/gpu: 2
              memory: 16Gi
          volumeMounts:
            - {name: cache, mountPath: /cache}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: cache
          emptyDir: {}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: apb-vllm
spec:
  selector: {app: vllm}
  ports:
    - {name: http, port: 8000, targetPort: http}
