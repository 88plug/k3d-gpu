accelDevice: ''
cpu_balloon_annotation: performance
resources:
  requests:
    cpu: '{{ .Values.cpu }}'
    memory: '{{ .Values.memory }}'
block_size: 128
max_num_seqs: 256
max_seq_len_to_capture: 2048
d_type: bfloat16
max_model_len: 8192
image:
