  pullPolicy: IfNotPresent
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: ei-inference-eligible
          operator: In
          values:
          - 'true'
VLLM_CPU_SGL_KERNEL: '1'
VLLM_NO_USAGE_STATS: 1
DO_NOT_TRACK: 1
LLM_MODEL_ID: ''
