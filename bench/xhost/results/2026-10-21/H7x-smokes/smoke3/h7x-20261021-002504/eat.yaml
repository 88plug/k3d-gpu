---
# Source: vllm/templates/deployment.yaml
# Copyright (C) 2025-2026 Intel Corporation
# SPDX-License-Identifier: Apache-2.0
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen-3-4b-cpu
  labels:
    helm.sh/chart: vllm-0-latest
    app.kubernetes.io/name: vllm
    app.kubernetes.io/instance: vllm-qwen-3-4b-cpu
    app.kubernetes.io/version: "0.5"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
      app.kubernetes.io/instance: vllm-qwen-3-4b-cpu
  template:
    metadata:
      annotations:
        balloon.balloons.resource-policy.nri.io: "performance"
      labels:
        app.kubernetes.io/name: vllm
        app.kubernetes.io/instance: vllm-qwen-3-4b-cpu
        name: vllm
    spec:
      #
      # serviceAccountName: default
      securityContext:
        null
      containers:
        - name: vllm
          envFrom:
            - configMapRef:
                name: vllm-qwen-3-4b-cpu-config
            - secretRef:
                name: vllm-qwen-3-4b-cpu-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
              - SYS_NICE
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          image: "vllm/vllm-openai-cpu:v0.24.0@sha256:b0e6f8604413a8bfcca8836bb4b57b47f1aa653957e07f8903ece531309981a1"
          imagePullPolicy: IfNotPresent
          # command:
          #   - /bin/bash
          #   - -c
          #   - |
          #     python3 -m vllm.entrypoints.openai.api_server --dtype bfloat16  --model Qwen/Qwen3-4B --port 2080 --tensor-parallel-size 1 --block-size 128 --max-model-len 8192 --disable-log-requests
          args:
            - "--block-size"
            - "128"
            - "--dtype"
            - "bfloat16"
            - "--distributed_executor_backend"
            - "mp"
            - "--enable_chunked_prefill"
            - "--enforce-eager"
            - "--max-num-batched-tokens"
            - "2048"
            - "--max-num-seqs"
            - "256"
            - "--enable-prefix-caching"
            # CPU deployment - add parallelism settings
            - "--tensor-parallel-size"
            - "1"
            - "--pipeline-parallel-size"
            - "1"
            - "--model"
            - "Qwen/Qwen3-4B"
            - --served-model-name
            - "Qwen/Qwen3-4B"
            - "--port"
            - "2080"
          volumeMounts:
            - mountPath: /data
              name: model-volume
            - mountPath: /dev/shm
              name: shm
            - mountPath: /tmp
              name: tmp
            - mountPath: /root/.cache/vllm
              name: vllm-cache
          ports:
            - name: http
              containerPort: 2080
              protocol: TCP
          readinessProbe:
            failureThreshold: 98
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
          resources:
            requests:
              cpu: "16"
              memory: "16Gi"
            limits:
              cpu: "16"
              memory: "16Gi"
            
      volumes:
        - name: model-volume
          persistentVolumeClaim:
            claimName: vllm-qwen-3-4b-cpu-pvc
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: tmp
          emptyDir: {}
        - name: vllm-cache
          emptyDir: {}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: ei-inference-eligible
                operator: In
                values:
                - "true"
      # extra time to finish processing buffered requests on CPU before pod is forcibly terminated
      terminationGracePeriodSeconds: 120
---
