# EXAMPLE ONLY. Joule Ledger node daemon. Not shipped in share/, not packaged,
# not applied by the launcher. The image below is NOT published: build it from
# tools/joule_ledger/Dockerfile, push it, and set the reference before applying.
#
# One pod per node: RAPL and NVML counters are per socket / per device, so a
# per-pod sidecar would read the same counter many times over.
#
# Reads, read-only:
#   /sys/class/powercap/intel-rapl:*/energy_uj   (root-only -> privileged)
#   NVML total energy (driver libs come from the node's default nvidia runtime
#   when k3d-gpu found NVIDIA; elsewhere the daemon runs RAPL-only)
#   /proc/<pid>/fdinfo DRM usage keys            (hostPID: the k3d node's PID ns)
#
# Serves per-span bounds only (no raw counter edges) on the pod IP, port 9810.
# Access: bearer token from Secret joule-ledger-token, and a NetworkPolicy that
# admits only pods labelled k3d-gpu.io/energy-reader: "true" (k3s enforces
# NetworkPolicy with its embedded kube-router controller unless started with
# --disable-network-policy). Create the token first:
#   kubectl -n k3d-gpu-energy create secret generic joule-ledger-token \
#     --from-literal=token="$(openssl rand -hex 32)"
apiVersion: v1
kind: Namespace
metadata:
  name: k3d-gpu-energy
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: joule-ledger
  namespace: k3d-gpu-energy
  labels:
    app.kubernetes.io/name: joule-ledger
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: joule-ledger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: joule-ledger
    spec:
      hostPID: true
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      tolerations:
      - operator: Exists
      containers:
      - name: joule-ledger
        image: ghcr.io/88plug/k3d-gpu-joule-ledger:UNPUBLISHED
        args: ["--tick", "0.010", "--latency", "0.025",
               "--listen", "$(POD_IP):9810", "--token-file", "/run/joule-ledger/token"]
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: utility
        securityContext:
          privileged: true
          readOnlyRootFilesystem: true
        ports:
        - name: ledger
          containerPort: 9810
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: sys
          mountPath: /sys
          readOnly: true
        - name: token
          mountPath: /run/joule-ledger
          readOnly: true
      volumes:
      - name: sys
        hostPath:
          path: /sys
      - name: token
        secret:
          secretName: joule-ledger-token
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: joule-ledger
  namespace: k3d-gpu-energy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: joule-ledger
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k3d-gpu.io/energy-reader: "true"
    ports:
    - protocol: TCP
      port: 9810
---
apiVersion: v1
kind: Service
metadata:
  name: joule-ledger
  namespace: k3d-gpu-energy
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: joule-ledger
  ports:
  - name: ledger
    port: 9810
    targetPort: 9810
