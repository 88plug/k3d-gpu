# Known upstream issues k3d-gpu depends on: bugs, behaviour changes and security
# advisories, each with the release that fixes it. hack/known-issues reads this
# file (Python tomllib); `hack/known-issues check` runs in CI, offline.
#
# Fields of each [[issue]]:
#   id           lowercase id; markers name it
#   title        one line
#   kind         bug | change | advisory
#   upstream     "owner/repo#n" (an issue or a pull request), or ""
#   fix          {} when unknown, or one of:
#                  {repo, sha and/or pr}        the commit or pull request that fixes it
#                  {repo, path, contains}       fixed in the first release whose file
#                                               `path` contains `contains`
#                  {ecosystem, package}         GitHub advisory database (kind advisory)
#   component    what the sites pin (vllm-openai-cpu, kserve, litellm, ...)
#   scheme       a hack/pinver.py scheme for the site versions and the fields below
#   affected     a pinver range of affected versions ("*" until the fix is known)
#   fixed_in     the first release with the fix; "" until known. Must lie outside
#                `affected` (narrow `affected` when setting it).
#   adopt        review | auto. auto is owner consent to take a patch or minor fix
#                without review; a major always needs review.
#   sites        [{file, regex}]: where k3d-gpu pins the component. Each regex
#                (Python re, MULTILINE) has a named group `v` and must match at
#                least once. Files are "ours" or "eat-stock" only (pins/classes).
#   workarounds  files carrying `known-issue: <id>` markers (or a
#                `known-issue-begin: <id>` .. `known-issue-end: <id>` block) for
#                code or docs that exist because of the issue. Never in bench/,
#                oracle/seed/, console/matrix.v1.json or EXPERIMENTS.md.
#   retained     {} or {reason, pr}: the workarounds stay after the fix, and why
#   ledger_refs  [{row, path, regex?}]: ledger rows whose recorded versions the
#                issue touches. Informational: reported, never failed, never edited.
#   advisories   kind advisory: the GHSA ids this entry covers
#   image        optional image reference template ({tag} = release tag,
#                {version} = tag without a leading v); poll checks it resolves
#   test         optional: a test path or canary:<id>
#   notes        free text
#
# A check fails when an "ours" site's version is inside `affected` while `fixed_in`
# is set (bump it), or when workarounds remain after every "ours" site reached
# `fixed_in` and `retained` is empty (remove them, or say why they stay).
# `hack/known-issues poll` (network, read-only) finds fixed_in for open entries.

[[issue]]
id = "vllm-45844"
title = "vLLM CPU attention sizes its split-KV scratchpad too small (Gemma 4 global layers stall, EngineDeadError)"
kind = "bug"
upstream = "vllm-project/vllm#45844"
fix = {repo = "vllm-project/vllm", sha = "26eb87204d58d9d8a25c378fbaec9da23db3fb85", pr = 45844}
component = "vllm-openai-cpu"
scheme = "zerover"
affected = "<0.25.0"
fixed_in = "0.25.0"
adopt = "review"
image = "vllm/vllm-openai-cpu:{tag}"
sites = [
  {file = "scripts/k3d-gpu", regex = '^AMX_TEST_IMAGE="\$\{K3D_GPU_AMX_TEST_IMAGE:-vllm/vllm-openai-cpu:v(?P<v>\d+\.\d+\.\d+)@sha256:'},
  {file = "console/moe_predict.py", regex = '"vllm/vllm-openai-cpu:v(?P<v>\d+\.\d+\.\d+)@sha256:'},
  {file = "integrations/eat/vllm-values.yaml", regex = 'repository: vllm/vllm-openai-cpu\n\s+tag: "v(?P<v>\d+\.\d+\.\d+)@sha256:'},
]
workarounds = []
ledger_refs = [
  {row = "H54a", path = "bench/h54/h54.py", regex = '"vllm024": "vllm/vllm-openai-cpu:v(?P<v>\d+\.\d+\.\d+)@'},
  {row = "H53", path = "bench/eatflow/live.sh", regex = 'B1_TAG=\$\{LIVE_EAT_B1_TAG:-v(?P<v>\d+\.\d+\.\d+)@'},
]
notes = """The B1g stall (EXPERIMENTS.md, H54 note N2). Merged 2026-07-04 as 26eb8720; GitHub's \
compare puts it in v0.25.0 (behind 106, ahead 0) and not in v0.24.0 (diverged). EAT \
release-1.0.3-hotfix pins v0.24.0; EAT release-1.1.0 moves to v0.28.0. The ledger arms stay \
on v0.24.0: changing them takes a dated amendment."""

[[issue]]
id = "vllm-50801"
title = "vLLM no longer reads VLLM_CPU_SGL_KERNEL (CPU kernel dispatch refined)"
kind = "change"
upstream = "vllm-project/vllm#50801"
fix = {repo = "vllm-project/vllm", sha = "c8602c79062440074a018c1d5f875a5571eb6881", pr = 50801}
component = "vllm-openai-cpu"
scheme = "zerover"
affected = "<0.28.0"
fixed_in = "0.28.0"
adopt = "review"
sites = [
  {file = "integrations/eat/vllm-values.yaml", regex = 'repository: vllm/vllm-openai-cpu\n\s+tag: "v(?P<v>\d+\.\d+\.\d+)@sha256:'},
]
workarounds = []
notes = """EAT's xeon-values.yaml sets VLLM_CPU_SGL_KERNEL=1 (integrations/eat/README.md); from \
v0.28.0 on it is a no-op, so an EAT image at or past v0.28.0 runs without the SGL kernels it \
asks for. k3d-gpu's own vLLM CPU path does not set it."""

