[[issue]]
id = "vllm-0.32-num-spec-tokens"
title = "vLLM v0.32.0 compares num_speculative_tokens before defaulting it (gemma4_mtp drafter with no length exits with a TypeError)"
kind = "bug"
upstream = ""
fix = {}
component = "vllm"
scheme = "zerover"
affected = ">=0.32.0"
fixed_in = ""
adopt = "review"
sites = [
  {file = "console/model_opt.py", regex = 'o\.get\("vllm_version"\) or "(?P<v>\d+\.\d+\.\d+)"'},
]
workarounds = []
ledger_refs = [
  {row = "H54q", path = "bench/h54/h54.py"},
]
notes = """File upstream: config/speculative.py rewrites a gemma4_assistant drafter to gemma4_mtp \
with n_predict 1, then reaches the MTP branch's num_speculative_tokens > 1 check before the line \
that defaults num_speculative_tokens to n_predict ("TypeError: '>' not supported between \
instances of 'NoneType' and 'int'"). H54 amendment R2 names the length (1). The optimizer always \
names num_speculative_tokens, so its plans do not hit it."""
