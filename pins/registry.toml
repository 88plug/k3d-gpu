# =============================================================================
# Base images with a line policy of their own
# =============================================================================
[[pin]]
id = "ubuntu-node-base"
class = "ours"
group = "images"
family = "base-image"
scheme = "docker-suffix"
notes = "The node image tracks the newest Ubuntu LTS (YY.04); interim releases are skipped."
source = { kind = "oci", image = "ubuntu", tag = "{v}" }
patterns = { v = '[0-9]{2}\.04' }
canary = ["node"]
sites = [{ file = "Dockerfile", regex = '^ARG UBUNTU_IMAGE="ubuntu:(?P<v>[0-9]{2}\.04)@(?P<digest>sha256:[0-9a-f]{64})"$' }]

[[pin]]
id = "ubuntu-2404-variant"
class = "ours"
group = "images"
family = "base-image"
scheme = "docker-suffix"
notes = "The 24.04 variant stays on 24.04: only its digest moves."
source = { kind = "oci", image = "ubuntu", tag = "{v}" }
patterns = { v = '24\.04' }
canary = ["node"]
sites = [{ file = "Dockerfile", regex = '^ARG UBUNTU_2404_IMAGE="ubuntu:(?P<v>24\.04)@(?P<digest>sha256:[0-9a-f]{64})"$' }]

[[pin]]
id = "examples-python"
class = "ours"
group = "examples"
family = "base-image"
scheme = "docker-suffix"
notes = "The image the agent examples run in, and that their constraints.txt files are frozen in."
source = { kind = "oci", image = "python", tag = "{v}-slim-trixie" }
patterns = { v = '[0-9]+\.[0-9]+\.[0-9]+' }
sites = [
  { file = "tests/agent_examples_test.sh", ref = "python", tag = "{v}-slim-trixie" },
  { file = "tests/agent_examples_test.sh", regex = '^# python:(?P<v>[0-9.]+)-slim-trixie \(multi-arch index digest\)$' },
]
