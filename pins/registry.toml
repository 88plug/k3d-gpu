# Every pin of class ours or eat-stock the freshness bumper (hack/bump) moves, where
# it comes from and where it lives. Read by hack/pins, hack/bump and the Freshness
# workflow (.github/workflows/freshness.yml). How to add a pin, group, hold or known
# issue: pins/README.md. `hack/pins check` (CI) proves every site below resolves in
# the tree, that derived values equal their parents and that every pinned image,
# requirements pin and Hugging Face revision in an ours or eat-stock file has an owner.
#
# Regexes are TOML literal strings ('...'): no escaping. Named groups are the spans.

# ---- groups: one PR each, on branch autobump/<group> ---------------------------
# tests: suites hack/bump runs after the rewrite (CI runs them all again on the PR).
# hooks: built-in steps hack/bump runs after the rewrite, in order (pins/README.md).
# outputs: files the hooks write (hack/pin-only-diff accepts any change there).

[groups.k3s]
tests = ["tests/image_pins_test.sh"]
hooks = ["lock", "readme-history"]
outputs = ["images.lock"]

[groups.nvidia-plugin]
tests = ["tests/image_pins_test.sh", "tests/detect_test.sh"]
hooks = ["lock", "readme-history"]
outputs = ["images.lock"]

[groups.intel-plugins]
tests = ["tests/image_pins_test.sh", "tests/detect_test.sh"]
hooks = ["lock", "readme-history"]
outputs = ["images.lock"]

[groups.gaudi-plugin]
tests = ["tests/image_pins_test.sh", "tests/detect_test.sh"]
hooks = ["lock", "readme-history"]
outputs = ["images.lock"]

[groups.cuda-test]
tests = ["tests/image_pins_test.sh"]
hooks = ["lock"]
outputs = ["images.lock"]

[groups.nvctk]
tests = ["tests/host_setup_test.sh"]
hooks = ["readme-history"]

[groups.ppa]
tests = ["tests/host_setup_test.sh"]
hooks = ["ppa-write"]

[groups.nri]
tests = ["tests/render_test.sh", "tests/image_pins_test.sh"]
hooks = ["render-latest", "lock"]
outputs = ["hack/components/nri-balloons/component.conf", "hack/components/nri-balloons-guard/component.conf",
           "share/nri-balloons.yml", "share/nri-balloons-guard.yml", "images.lock"]

[groups.llama-cpp]
tests = ["tests/image_pins_test.sh", "tests/llamacpp_test.sh"]
hooks = ["lock", "ledger-rules"]
outputs = ["images.lock", "console/ledger-rules.json"]

[groups.vllm-cpu]
tests = ["tests/image_pins_test.sh", "tests/console_test.sh"]
hooks = ["lock", "ledger-rules"]
outputs = ["images.lock", "console/ledger-rules.json"]

[groups.vllm-xpu]
tests = ["tests/image_pins_test.sh", "tests/console_test.sh", "tests/model_opt_test.sh"]
hooks = ["lock", "ledger-rules"]
outputs = ["images.lock", "console/ledger-rules.json"]

[groups.llm-scaler]
tests = ["tests/image_pins_test.sh", "tests/console_test.sh"]
hooks = ["lock", "ledger-rules"]
outputs = ["images.lock", "console/ledger-rules.json"]

[groups.gaudi-vllm]
tests = ["tests/image_pins_test.sh", "tests/console_test.sh"]
hooks = ["lock", "ledger-rules"]
outputs = ["images.lock", "console/ledger-rules.json"]

[groups.ovms]
tests = ["tests/image_pins_test.sh", "tests/console_test.sh"]
hooks = ["lock", "ledger-rules"]
outputs = ["images.lock", "console/ledger-rules.json"]

[groups.npu-umd]
tests = ["tests/image_pins_test.sh", "tests/detect_test.sh"]
hooks = ["lock"]
outputs = ["images.lock"]

[groups.dlstreamer]
tests = ["tests/image_pins_test.sh"]
hooks = ["lock"]
outputs = ["images.lock"]

[groups.sglang]
tests = ["tests/console_test.sh"]
hooks = ["ledger-rules"]
outputs = ["console/ledger-rules.json"]

[groups.hf-qwen3-4b]
tests = ["tests/detect_test.sh"]

[groups.hf-qwen3-ov]
tests = ["tests/detect_test.sh"]

[groups.hf-console-fallback]
tests = ["tests/model_opt_test.sh"]

[groups.convert-pins]
tests = ["tests/console_test.sh", "tests/model_opt_test.sh"]
hooks = ["convert-pins"]
outputs = ["console/convert-pins.json"]

[groups.gguf-convert-pip]
tests = ["tests/llamacpp_test.sh"]

[groups.host-intel]
tests = ["tests/host_setup_test.sh"]

[groups.telemetry]
tests = ["tests/telemetry_test.sh", "tests/image_pins_test.sh"]
hooks = ["lock"]
outputs = ["images.lock"]

[groups.opt-in-manifests]
tests = ["tests/image_pins_test.sh", "tests/chat_ui_test.sh"]
hooks = ["lock"]
outputs = ["images.lock"]

[groups.tools]
tests = ["tests/render_test.sh", "tests/packaging_test.sh"]

[groups.packaging-images]
tests = ["tests/packaging_test.sh"]

[groups.devcontainer]
tests = []

[groups.docs-build]
tests = ["tests/docs_test.sh"]
hooks = ["docs-lock"]
outputs = ["docs-build/requirements.txt"]

[groups.flake]
tests = ["tests/packaging_test.sh"]
hooks = ["flake-update"]
outputs = ["flake.lock"]

[groups.examples]
tests = ["tests/kserve_test.sh"]
hooks = ["constraints"]
outputs = ["examples/agents/*/constraints.txt"]

[groups.eat-stock]
tests = ["tests/eat_test.sh", "tests/image_pins_test.sh"]
hooks = ["lock"]
outputs = ["images.lock"]

[groups.images]
tests = ["tests/image_pins_test.sh"]
hooks = ["lock"]
outputs = ["images.lock"]

[groups.digests]
tests = ["tests/image_pins_test.sh", "tests/audit_test.sh", "tests/render_test.sh"]
hooks = ["repin", "lock"]
outputs = ["images.lock"]

# ---- images.default ------------------------------------------------------------
# Owns every pinned image reference in an ours or eat-stock file that no [[pin]]
# below names: source oci, scheme docker-suffix, the newest tag shaped like the
# current one. Its group is the first glob that matches the file.
[images.default]
family = "base-image"
groups = [
  { glob = "integrations/eat/*", group = "eat-stock" },
  { glob = "examples/kuberay/*", group = "eat-stock" },
  { glob = "examples/agents/litellm-gateway/*", group = "eat-stock" },
  { glob = "contrib/eat/*", group = "eat-stock" },
  { glob = "packaging/*", group = "packaging-images" },
  { glob = ".devcontainer/*", group = "devcontainer" },
  { glob = "docs-build/*", group = "docs-build" },
  { glob = "examples/*", group = "examples" },
  { glob = "tests/*", group = "examples" },
  { glob = "*", group = "images" },
]
# Exact references the default rule never moves, each with why. `hack/pins check`
# fails on an entry its file no longer holds.
frozen = [
  { file = "scripts/k3d-gpu", ref = "registry.k8s.io/agent-sandbox/agent-sandbox-controller:v1.0.7", reason = "SANDBOX_UNLABELLED_IMAGES: the controller an earlier k3d-gpu release installed before the managed-by label; sandbox ownership matches it exactly" },
]

# =============================================================================
# k3s
# =============================================================================
[[pin]]
id = "k3s"
class = "ours"
group = "k3s"
family = "k3s"
component = "rancher/k3s"
scheme = "k8s"
# The highest non-prerelease release by version (all minors release within
# seconds, so GitHub's "latest" flag is not the newest), "+k3s" read as "-k3s".
source = { kind = "github-release", repo = "k3s-io/k3s", select = "highest", tag = "{v}", tag_map = { "+" = "-" }, image = "rancher/k3s", image_tag = "{v}" }
# Docker Hub must serve the tag (rancher stopped per-arch -amd64 tags after v1.34.1).
confirm = { kind = "oci", image = "rancher/k3s", tag = "{v}" }
canary = ["node"]
sites = [
  { file = "Dockerfile", arg = "K3S_TAG" },
  { file = "Dockerfile", arg = "K3S_DIGEST", key = "digest" },
  { file = "README.md", regex = '^\| `K3S_TAG` +\| `(?P<v>v[0-9.]+-k3s[0-9]+)` ' },
]
derived = [
  { file = "README.md", regex = '^\| `K3S_DIGEST` \| `(?P<v>sha256:[0-9a-f]{8})…` ', from = "{digest:.15}" },
]

# =============================================================================
# Device plugins and the CTK
# =============================================================================
[[pin]]
id = "nvidia-device-plugin"
class = "ours"
group = "nvidia-plugin"
family = "plugin"
scheme = "semver"
source = { kind = "github-release", repo = "NVIDIA/k8s-device-plugin", tag = "{v}" }
confirm = { kind = "oci", image = "nvcr.io/nvidia/k8s-device-plugin", tag = "{v}" }
canary = ["node"]
sites = [
  { file = "share/nvidia-device-plugin.yml", ref = "nvcr.io/nvidia/k8s-device-plugin" },
]

[[pin]]
id = "intel-device-plugins"
class = "ours"
group = "intel-plugins"
family = "plugin"
scheme = "semver"
source = { kind = "github-release", repo = "intel/intel-device-plugins-for-kubernetes", tag = "v{v}" }
confirm = { kind = "oci", image = "intel/intel-gpu-plugin", tag = "{v}" }
canary = ["node"]
sites = [
  { file = "share/intel-gpu-plugin.yml", ref = "intel/intel-gpu-plugin" },
  { file = "share/intel-gpu-wsl-plugin.yml", ref = "intel/intel-gpu-plugin" },
  { file = "share/intel-gpu-wsl-plugin.yml", ref = "intel/intel-gpu-levelzero" },
  { file = "share/intel-npu-plugin.yml", ref = "intel/intel-npu-plugin" },
  { file = "share/intel-dsa-plugin.yml", ref = "intel/intel-dsa-plugin" },
  { file = "share/intel-iaa-plugin.yml", ref = "intel/intel-iaa-plugin" },
  { file = "share/intel-qat-plugin.yml", ref = "intel/intel-qat-plugin" },
  { file = "scripts/k3d-gpu", var = "NPU_PLUGIN_TAG" },
  # The NodeFeatureRules baked with NFD come from the same release.
  { file = "share/node-feature-discovery.yml", regex = '^# Node Feature Discovery v[0-9.]+ \+ Intel device-plugin NodeFeatureRules v(?P<v>[0-9.]+)$' },
  { file = "share/node-feature-discovery.yml", regex = 'intel-device-plugins-for-kubernetes/tree/v(?P<v>[0-9.]+)/deployments/nfd' },
  { file = "share/node-feature-discovery.yml", regex = 'intel-device-plugins-for-kubernetes-(?P<v>[0-9.]+)/deployments/nfd' },
]

[[pin]]
id = "gaudi-device-plugin"
class = "ours"
group = "gaudi-plugin"
family = "plugin"
scheme = "apt"
source = { kind = "oci", image = "docker.io/intel/gaudi-device-plugin", tag = "{v}" }
canary = ["node"]
sites = [
  { file = "share/gaudi-device-plugin.yml", ref = "docker.io/intel/gaudi-device-plugin" },
]

[[pin]]
id = "cuda-test-image"
class = "ours"
group = "cuda-test"
family = "base-image"
scheme = "semver"
source = { kind = "oci", image = "nvidia/cuda", tag = "{v}-base-ubuntu26.04" }
sites = [
  { file = "scripts/k3d-gpu", ref = "nvidia/cuda", tag = "{v}-base-ubuntu26.04" },
]

[[pin]]
id = "nvctk"
class = "ours"
group = "nvctk"
family = "plugin"
scheme = "apt"
# The toolkit, its base and the libnvidia-container libraries share one version.
source = { kind = "apt-index", url = "https://nvidia.github.io/libnvidia-container/stable/deb/amd64/Packages", package = "nvidia-container-toolkit", also = ["nvidia-container-toolkit-base", "libnvidia-container-tools", "libnvidia-container1"] }
canary = ["node"]
sites = [
  { file = "Dockerfile", arg = "NVIDIA_CTK_VERSION" },
]
derived = [
  { file = "scripts/k3d-gpu", regex = '^HS_NVCTK=(?P<v>\S+)$', from = "{v}" },
  { file = "scripts/k3d-gpu", regex = '^#   nvidia-container-toolkit (?P<v>\S+) \(NVIDIA', from = "{v}" },
]

[[pin]]
id = "nvidia-container-runtime"
class = "ours"
group = "nvctk"
family = "plugin"
scheme = "apt"
source = { kind = "apt-index", url = "https://nvidia.github.io/libnvidia-container/stable/deb/amd64/Packages", package = "nvidia-container-runtime" }
canary = ["node"]
sites = [
  { file = "Dockerfile", arg = "NVIDIA_CONTAINER_RUNTIME_VERSION" },
]

# =============================================================================
# Host setup: the kobuk-team PPA builds (hack/ppa-pins writes them) and Intel's
# GitHub .debs and archives
# =============================================================================
[[pin]]
id = "ppa-media"
class = "ours"
group = "ppa"
family = "host-ppa"
scheme = "apt"
writer = "hook"
source = { kind = "cmd", run = ["hack/ppa-pins"], parse = "kv", key = "HS_PPA_MEDIA" }
sites = [{ file = "scripts/k3d-gpu", var = "HS_PPA_MEDIA" }]

[[pin]]
id = "ppa-gmm"
class = "ours"
group = "ppa"
family = "host-ppa"
scheme = "apt"
writer = "hook"
source = { kind = "cmd", run = ["hack/ppa-pins"], parse = "kv", key = "HS_PPA_GMM" }
sites = [{ file = "scripts/k3d-gpu", var = "HS_PPA_GMM" }]

[[pin]]
id = "ppa-libva"
class = "ours"
group = "ppa"
family = "host-ppa"
scheme = "apt"
writer = "hook"
source = { kind = "cmd", run = ["hack/ppa-pins"], parse = "kv", key = "HS_PPA_LIBVA" }
sites = [{ file = "scripts/k3d-gpu", var = "HS_PPA_LIBVA" }]

[[pin]]
id = "compute-runtime"
class = "ours"
group = "host-intel"
family = "host-driver"
scheme = "docker-suffix"
# The compute-runtime release notes name the IGC release it is built with (followed
# for its build number and .debs); every sha256 is a GitHub release asset digest.
source = { kind = "github-release", repo = "intel/compute-runtime", tag = "{v}", body = { igc = 'intel-graphics-compiler/releases/tag/v([0-9.]+)' }, assets = { sha_ocl = "intel-opencl-icd_{v}-0_amd64.deb", sha_ze = "libze-intel-gpu1_{v}-0_amd64.deb" }, follow = [{ repo = "intel/intel-graphics-compiler", tag = "v{igc}", asset_match = { igc_build = 'intel-igc-core-2_[0-9.]+\+([0-9]+)_amd64\.deb' }, assets = { sha_igc_core = "intel-igc-core-2_{igc}+{igc_build}_amd64.deb", sha_igc_opencl = "intel-igc-opencl-2_{igc}+{igc_build}_amd64.deb" } }] }
sites = [
  { file = "scripts/k3d-gpu", var = "HS_CR" },
  { file = "scripts/k3d-gpu", regex = '^intel-opencl-icd_\$\{HS_CR\}-0_amd64\.deb (?P<sha_ocl>[0-9a-f]{64}) ' },
  { file = "scripts/k3d-gpu", regex = '^libze-intel-gpu1_\$\{HS_CR\}-0_amd64\.deb (?P<sha_ze>[0-9a-f]{64}) ' },
  { file = "scripts/k3d-gpu", regex = 'intel-graphics-compiler/releases/download/v(?P<igc>[0-9.]+)"$' },
  { file = "scripts/k3d-gpu", regex = '^intel-igc-core-2_(?P<igc>[0-9.]+)\+(?P<igc_build>[0-9]+)_amd64\.deb (?P<sha_igc_core>[0-9a-f]{64}) ' },
  { file = "scripts/k3d-gpu", regex = '^intel-igc-opencl-2_(?P<igc>[0-9.]+)\+(?P<igc_build>[0-9]+)_amd64\.deb (?P<sha_igc_opencl>[0-9a-f]{64}) ' },
]
derived = [
  { file = "scripts/k3d-gpu", regex = '^#   intel/compute-runtime (?P<v>[0-9.]+) with', from = "{v}" },
  { file = "scripts/k3d-gpu", regex = '^#   intel/compute-runtime [0-9.]+ with intel-graphics-compiler v(?P<v>[0-9.]+)$', from = "{igc}" },
  { file = "README.md", regex = 'sha256-checked: compute-runtime (?P<v>[0-9.]+), IGC', from = "{v}" },
  { file = "README.md", regex = 'compute-runtime [0-9.]+, IGC (?P<v>[0-9.]+);', from = "{igc}" },
]

[[pin]]
id = "level-zero"
class = "ours"
group = "host-intel"
family = "host-driver"
scheme = "semver"
source = { kind = "github-release", repo = "oneapi-src/level-zero", tag = "v{v}", assets = { sha = "libze1_{v}+u24.04_amd64.deb" } }
sites = [
  { file = "scripts/k3d-gpu", regex = '^HS_ZE_DEB="libze1_(?P<v>[0-9.]+)\+u24\.04_amd64\.deb (?P<sha>[0-9a-f]{64}) https://github\.com/oneapi-src/level-zero/releases/download/v(?P=v)"$' },
]
derived = [
  { file = "scripts/k3d-gpu", regex = '^#   oneapi-src/level-zero v(?P<v>[0-9.]+) \(libze1', from = "{v}" },
]

[[pin]]
id = "npu-driver"
class = "ours"
group = "host-intel"
family = "host-driver"
scheme = "semver"
source = { kind = "github-release", repo = "intel/linux-npu-driver", tag = "v{v}", asset_match = { build = '^linux-npu-driver-v([0-9.]+-[0-9]+)-ubuntu2404\.tar\.gz$' }, assets = { sha_2404 = "linux-npu-driver-v{build}-ubuntu2404.tar.gz", sha_2604 = "linux-npu-driver-v{build}-ubuntu2604.tar.gz" } }
sites = [
  { file = "scripts/k3d-gpu", var = "HS_NPU_REL", key = "tag" },
  { file = "scripts/k3d-gpu", var = "HS_NPU_BUILD", key = "build" },
  { file = "scripts/k3d-gpu", regex = '^        24\.04\) echo "linux-npu-driver-v\$\{HS_NPU_BUILD\}-ubuntu2404\.tar\.gz (?P<sha_2404>[0-9a-f]{64})"' },
  { file = "scripts/k3d-gpu", regex = '^        26\.04\) echo "linux-npu-driver-v\$\{HS_NPU_BUILD\}-ubuntu2604\.tar\.gz (?P<sha_2604>[0-9a-f]{64})"' },
  { file = "scripts/k3d-gpu", regex = '^#   intel/linux-npu-driver v(?P<v>[0-9.]+) \(UMD' },
]

[[pin]]
id = "linux-tools"
class = "ours"
group = "host-intel"
family = "tools"
scheme = "semver"
notes = "intel-speed-select, built in the node image from this kernel release's tools/."
source = { kind = "json", url = "https://www.kernel.org/releases.json", path = "latest_stable.version", regex = '^(?P<v>[0-9]+\.[0-9]+(\.[0-9]+)?)$', sums = { sha = { url = "https://cdn.kernel.org/pub/linux/kernel/v{v_major}.x/sha256sums.asc", name = "linux-{v}.tar.xz" } } }
canary = ["node"]
sites = [
  { file = "Dockerfile", arg = "LINUX_TOOLS_VERSION" },
  { file = "Dockerfile", arg = "LINUX_TOOLS_SHA256", key = "sha" },
]

