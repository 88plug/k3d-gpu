[[pin]]
id = "nixpkgs"
class = "ours"
group = "flake"
family = "tools"
scheme = "hf-sha"
writer = "hook"
notes = "The nixos-26.05 branch head; the flake-update hook runs `nix flake update` in the pinned nix image."
source = { kind = "github-branch", repo = "NixOS/nixpkgs", branch = "nixos-26.05" }
sites = [
  { file = "flake.lock", regex = '"owner": "NixOS",\n +"repo": "nixpkgs",\n +"rev": "(?P<v>[0-9a-f]{40})"' },
]

