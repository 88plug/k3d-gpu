# =============================================================================
# Engines
# =============================================================================
[[pin]]
id = "llama-cpp"
class = "ours"
group = "llama-cpp"
family = "runtime-engine"
component = "llama.cpp"
scheme = "llama"
# releases/latest vX.Y.Z; its images are tagged with the bNNNNN build of the same commit.
source = { kind = "llama", repo = "ggml-org/llama.cpp" }
patterns = { build = 'b[0-9]+' }
canary = ["llama-cpu", "llama-sycl", "llama-vulkan", "llama-full"]
sites = [
  { file = "scripts/k3d-gpu", ref = "ghcr.io/ggml-org/llama.cpp", tag = "server-intel-{build}" },
  { file = "scripts/k3d-gpu", ref = "ghcr.io/ggml-org/llama.cpp", tag = "server-{build}" },
  { file = "scripts/k3d-gpu", ref = "ghcr.io/ggml-org/llama.cpp", tag = "full-{build}" },
  { file = "scripts/k3d-gpu", ref = "ghcr.io/ggml-org/llama.cpp", tag = "server-vulkan-{build}" },
  { file = "scripts/k3d-gpu", regex = 'llama\.cpp:server-vulkan-(?P<build>b[0-9]+), the multi-arch' },
  { file = "scripts/k3d-gpu", regex = '^# index built from release (?P<v>v[0-9.]+) \(tag (?P<build>b[0-9]+), commit (?P<commit>[0-9a-f]{40})\)\.$' },
  { file = "scripts/k3d-gpu", regex = '^# The llama\.cpp agent backend: release (?P<v>v[0-9.]+) \(tag (?P<build>b[0-9]+), commit$' },
  { file = "bench/competitors.lock", ref = "ghcr.io/ggml-org/llama.cpp", tag = "server-{build}" },
  { file = "console/moe_predict.py", ref = "ghcr.io/ggml-org/llama.cpp", tag = "server-{build}" },
  { file = "console/moe_predict.py", ref = "ghcr.io/ggml-org/llama.cpp", tag = "server-intel-{build}" },
  { file = "console/moe_predict.py", regex = '^# llama\.cpp names the agent.s own llama\.cpp pins \(release (?P<v>v[0-9.]+), tag (?P<build>b[0-9]+)\)' },
]
derived = [
  { file = "scripts/k3d-gpu", regex = '^# (?P<v>[0-9a-f]{40})\), the latest release on', from = "{commit}" },
  { file = "bench/competitors.lock", regex = 'github\.com/ggml-org/llama\.cpp/blob/(?P<v>v[0-9.]+)/common/arg\.cpp', from = "{v}" },
  { file = "console/model_opt.py", regex = 'github\.com/ggml-org/llama\.cpp/blob/(?P<v>v[0-9.]+)/', from = "{v}", count = "any" },
  { file = "console/fit.py", regex = 'llama\.cpp (?P<v>v[0-9.]+).s convert_hf_to_gguf\.py', from = "{v}", count = "any" },
]

